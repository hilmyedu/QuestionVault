<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mino Notes - Modal Rich Text</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    :root {
      --bg-app: #f4f6fb;
      --sidebar-bg: #ffffff;
      --card-blue: #dbeafe;
      --card-pink: #ffe4e6;
      --card-yellow: #fef08a;
      --card-green: #dcfce7;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --border: #e2e8f0;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-app);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    aside {
      width: 240px;
      background: var(--sidebar-bg);
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-right: 1px solid var(--border);
      flex-shrink: 0;
    }

    .brand {
      font-weight: 800;
      font-size: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding-left: 10px;
    }

    .brand-icon {
      width: 12px;
      height: 12px;
      background: var(--primary);
      border-radius: 50%;
      box-shadow: 14px 0 0 #ef4444, 28px 0 0 #eab308;
    }

    .nav-menu {
      margin-top: 30px;
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .nav-item {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.2s;
    }

    .nav-item:hover, .nav-item.active {
      background: #eff6ff;
      color: var(--primary);
    }

    #app {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      height: 70px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 32px;
      flex-shrink: 0;
    }

    .search-box {
      background: var(--bg-app);
      padding: 10px 18px;
      border-radius: 20px;
      border: 1px solid var(--border);
      width: 280px;
      font-size: 14px;
      outline: none;
    }

    .profile-area { position: relative; }

    .profile-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px 12px;
      border-radius: 30px;
      transition: background 0.2s;
    }

    .profile-btn:hover { background: var(--bg-app); }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #3b82f6;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 14px;
    }

    .dropdown-menu {
      position: absolute;
      right: 0;
      top: 50px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 16px;
      width: 230px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      display: none;
      flex-direction: column;
      padding: 8px;
      z-index: 100;
    }

    .dropdown-menu.show { display: flex; }

    .dropdown-item {
      padding: 10px 14px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
    }

    .dropdown-item:hover { background: #f1f5f9; }
    .dropdown-divider { height: 1px; background: var(--border); margin: 4px 0; }

    .content-area {
      flex-grow: 1;
      padding: 24px 32px;
      overflow-y: auto;
    }

    .section-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 14px;
      color: #0f172a;
    }

    .folder-pagination-wrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
    }

    .btn-nav-arrow {
      background: #fff;
      border: 1px solid #cbd5e1;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-weight: bold;
      flex-shrink: 0;
      user-select: none;
    }

    .btn-nav-arrow:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .folders-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 14px;
      flex-grow: 1;
    }

    .folder-card {
      background: #fff;
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 110px;
      position: relative;
    }

    .folder-card.active {
      border-color: var(--primary);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.1);
    }

    .folder-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .folder-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .btn-delete-folder {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 6px;
      line-height: 1;
      transition: all 0.2s;
    }

    .btn-delete-folder:hover {
      color: var(--danger);
      background: #fee2e2;
    }

    .folder-name {
      font-weight: 700;
      font-size: 13px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .folder-count {
      font-size: 11px;
      color: var(--text-muted);
    }

    .folder-add-btn {
      border: 2px dashed #cbd5e1;
      background: transparent;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    /* Input trigger card (opens modal) */
    .input-trigger-card {
      background: #fff;
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .fake-input {
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
    }

    .btn-submit {
      background: var(--text-main);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .notes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .note-card {
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 220px;
    }

    .note-tag {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 6px;
    }

    .note-q { font-size: 15px; font-weight: 700; margin-bottom: 10px; }

    .note-content {
      background: rgba(255,255,255,0.5);
      border: 1px solid rgba(0,0,0,0.08);
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 13px;
      width: 100%;
      min-height: 75px;
      max-height: 130px;
      overflow-y: auto;
      line-height: 1.4;
    }

    .note-content ul, .note-content ol { margin-left: 16px; }
    .note-content:empty:before { content: 'Tidak ada isi.'; color: var(--text-muted); }

    .note-foot {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
      font-size: 11px;
      opacity: 0.8;
    }

    .note-foot-actions { display: flex; gap: 10px; }
    .note-foot-actions button {
      background: none;
      border: none;
      font-weight: 700;
      cursor: pointer;
      font-size: 11px;
    }
    .btn-edit-note { color: var(--primary); }
    .btn-delete-note { color: var(--danger); }

    /* Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 999;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: #fff;
      border-radius: 16px;
      width: 100%;
      max-width: 480px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      font-size: 15px;
    }

    .modal-header span.close-x {
      cursor: pointer;
      font-size: 18px;
      color: var(--text-muted);
    }

    .modal input[type="text"], .modal select {
      width: 100%;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 14px;
      outline: none;
    }

    .toolbar {
      display: flex;
      gap: 4px;
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 8px 8px 0 0;
      padding: 6px;
      flex-wrap: wrap;
    }

    .toolbar button {
      background: transparent;
      border: none;
      padding: 6px 10px;
      font-size: 13px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-main);
    }

    .toolbar button:hover { background: var(--border); }

    .editor {
      background: var(--bg-app);
      border: 1px solid var(--border);
      border-radius: 0 0 8px 8px;
      padding: 12px;
      min-height: 140px;
      max-height: 260px;
      overflow-y: auto;
      outline: none;
      font-size: 14px;
      line-height: 1.5;
    }

    .editor[placeholder]:empty:before {
      content: attr(placeholder);
      color: var(--text-muted);
    }

    .modal-actions {
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    .btn-cancel {
      background: none;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      color: var(--text-muted);
    }

    .btn-save {
      background: var(--text-main);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 18px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }

    @media (max-width: 768px) {
      body { flex-direction: column; }
      aside { display: none; }
      header { padding: 0 16px; }
      .search-box { width: 150px; }
      .content-area { padding: 16px; }
      .folders-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

  <aside>
    <div>
      <div class="brand"><div class="brand-icon"></div> MINO NOTES</div>
      <ul class="nav-menu">
        <li class="nav-item active">📝 All Notes</li>
      </ul>
    </div>
    <div style="font-size: 11px; color: var(--text-muted);">
      Storage: Local Browser
    </div>
  </aside>

  <div id="app">
    <header>
      <input type="text" id="searchInput" class="search-box" placeholder="Cari catatan..." oninput="renderNotes()">

      <div class="profile-area">
        <button class="profile-btn" onclick="toggleProfileMenu(event)">
          <div class="avatar">M</div>
          <span style="font-size: 13px; font-weight: 700;">Profile ▾</span>
        </button>

        <div class="dropdown-menu" id="profileDropdown">
          <button class="dropdown-item" onclick="exportPDF('All Notes')">📄 Download All PDF</button>
          <button class="dropdown-item" onclick="exportPDF(activeFolder)">📑 Download PDF (Folder Ini)</button>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item" onclick="exportJSON()">💾 Export JSON</button>
          <label class="dropdown-item" style="cursor: pointer;">
            📂 Import JSON
            <input type="file" id="importFile" accept=".json" onchange="importJSON(event)" style="display:none;">
          </label>
        </div>
      </div>
    </header>

    <div class="content-area">
      <h2 class="section-title">Folders / Categories</h2>
      <div class="folder-pagination-wrapper">
        <button class="btn-nav-arrow" id="btnPrevFolder" onclick="changeFolderPage(-1)">◀</button>
        <div class="folders-grid" id="foldersContainer"></div>
        <button class="btn-nav-arrow" id="btnNextFolder" onclick="changeFolderPage(1)">▶</button>
      </div>

      <div class="input-trigger-card">
        <div class="fake-input" onclick="openModal()">Tulis pertanyaan / ide baru...</div>
        <button class="btn-submit" onclick="openModal()">+ Buat Catatan Baru</button>
      </div>

      <h2 class="section-title" id="notesTitle">My Notes</h2>
      <div class="notes-grid" id="notesGrid"></div>
    </div>
  </div>

  <!-- Modal Rich-Text Editor -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <span id="modalTitleLabel">Catatan Baru</span>
        <span class="close-x" onclick="closeModal()">&times;</span>
      </div>

      <input type="text" id="qInput" placeholder="Tulis pertanyaan / judul...">

      <select id="folderSelect"></select>

      <div>
        <div class="toolbar">
          <button type="button" title="Bold" onclick="execCmd('bold')"><b>B</b></button>
          <button type="button" title="Italic" onclick="execCmd('italic')"><i>I</i></button>
          <button type="button" title="Underline" onclick="execCmd('underline')"><u>U</u></button>
          <button type="button" title="Strikethrough" onclick="execCmd('strikeThrough')"><s>S</s></button>
          <button type="button" title="Bullet List" onclick="execCmd('insertUnorderedList')">• List</button>
          <button type="button" title="Numbered List" onclick="execCmd('insertOrderedList')">1. List</button>
        </div>
        <div id="editor" class="editor" contenteditable="true" placeholder="Tulis isi jawaban/refleksi di sini..."></div>
      </div>

      <div class="modal-actions">
        <button class="btn-cancel" onclick="closeModal()">Batal</button>
        <button class="btn-save" onclick="saveNote()">Simpan Catatan</button>
      </div>
    </div>
  </div>

   <script>
    const STORAGE_KEY_NOTES = 'mino_notes_responsive_v7';
    const STORAGE_KEY_FOLDERS = 'mino_folders_responsive_v7';
    const COLOR_CLASSES = ['card-blue', 'card-pink', 'card-yellow', 'card-green'];

    let notes = [];
    let folders = ['All Notes', 'Movie Review', 'Class Notes', 'Book Lists', 'Tech & Code'];
    let activeFolder = 'All Notes';
    let folderCurrentPage = 0;
    let editingId = null; // null = catatan baru, angka = sedang edit

    function getFoldersPerPage() {
      return window.innerWidth <= 768 ? 1 : 4;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const savedNotes = localStorage.getItem(STORAGE_KEY_NOTES);
      if (savedNotes) {
        try { notes = JSON.parse(savedNotes); } catch(e) { notes = []; }
      }

      const savedFolders = localStorage.getItem(STORAGE_KEY_FOLDERS);
      if (savedFolders) {
        try { folders = JSON.parse(savedFolders); } catch(e) {}
      }

      const customFoldersFromNotes = [...new Set(notes.map(n => n.folder))];
      customFoldersFromNotes.forEach(f => {
        if (f && !folders.includes(f)) folders.push(f);
      });

      render();

      document.addEventListener('click', (e) => {
        if (!e.target.closest('.profile-area')) {
          document.getElementById('profileDropdown').classList.remove('show');
        }
      });

      window.addEventListener('resize', () => {
        renderFolders();
      });
    });

    function save() {
      localStorage.setItem(STORAGE_KEY_NOTES, JSON.stringify(notes));
      localStorage.setItem(STORAGE_KEY_FOLDERS, JSON.stringify(folders));
      render();
    }

    function toggleProfileMenu(e) {
      e.stopPropagation();
      document.getElementById('profileDropdown').classList.toggle('show');
    }

    function renderFolders() {
      const container = document.getElementById('foldersContainer');
      const select = document.getElementById('folderSelect');
      const prevBtn = document.getElementById('btnPrevFolder');
      const nextBtn = document.getElementById('btnNextFolder');

      const foldersPerPage = getFoldersPerPage();
      const totalPages = Math.ceil(folders.length / foldersPerPage) || 1;

      if (folderCurrentPage < 0) folderCurrentPage = 0;
      if (folderCurrentPage >= totalPages) folderCurrentPage = totalPages - 1;

      prevBtn.disabled = (folderCurrentPage === 0);
      nextBtn.disabled = (folderCurrentPage >= totalPages - 1);

      const startIndex = folderCurrentPage * foldersPerPage;
      const visibleFolders = folders.slice(startIndex, startIndex + foldersPerPage);

      let folderHTML = '';

      visibleFolders.forEach((f, idx) => {
        const count = f === 'All Notes' ? notes.length : notes.filter(n => n.folder === f).length;
        const color = COLOR_CLASSES[(startIndex + idx) % COLOR_CLASSES.length];

        const isDefaultFolder = (f === 'All Notes');
        const deleteBtnHtml = isDefaultFolder ? '' : `
          <button class="btn-delete-folder" title="Hapus Folder" onclick="deleteFolder(event, '${f}')">✖</button>
        `;

        folderHTML += `
          <div class="folder-card ${activeFolder === f ? 'active' : ''}" onclick="selectFolder('${f}')">
            <div class="folder-top">
              <div class="folder-icon" style="background:${getBgColor(color)};">📂</div>
              ${deleteBtnHtml}
            </div>
            <div>
              <div class="folder-name">${f}</div>
              <div class="folder-count">${count} notes</div>
            </div>
          </div>
        `;
      });

      folderHTML += `
        <div class="folder-card folder-add-btn" onclick="addCustomFolder()">
          <div style="font-size: 20px; font-weight: bold;">+</div>
          <div class="folder-name">New Folder</div>
        </div>
      `;

      container.innerHTML = folderHTML;

      const availableFoldersForSelect = folders.filter(f => f !== 'All Notes');
      select.innerHTML = availableFoldersForSelect.map(f => `
        <option value="${f}" ${f === activeFolder ? 'selected' : ''}>${f}</option>
      `).join('');
    }

    function changeFolderPage(dir) {
      folderCurrentPage += dir;
      renderFolders();
    }

    function selectFolder(fName) {
      activeFolder = fName;
      render();
    }

    function addCustomFolder() {
      const name = prompt('Masukkan Nama Folder/Kategori Baru:');
      if (name && name.trim() !== '') {
        const trimmed = name.trim();
        if (!folders.includes(trimmed)) {
          folders.push(trimmed);
        }
        activeFolder = trimmed;

        const foldersPerPage = getFoldersPerPage();
        folderCurrentPage = Math.floor((folders.length - 1) / foldersPerPage);
        save();
      }
    }

    function deleteFolder(event, folderName) {
      event.stopPropagation();

      if (folderName === 'All Notes') return;

      const notesInFolder = notes.filter(n => n.folder === folderName).length;
      let confirmMsg = `Yakin ingin menghapus folder "${folderName}"?`;
      if (notesInFolder > 0) {
        confirmMsg += `\n\nAda ${notesInFolder} catatan di folder ini. Catatan akan dipindahkan ke folder 'General'.`;
      }

      if (confirm(confirmMsg)) {
        folders = folders.filter(f => f !== folderName);

        notes.forEach(n => {
          if (n.folder === folderName) {
            n.folder = 'General';
          }
        });

        if (notes.some(n => n.folder === 'General') && !folders.includes('General')) {
          folders.push('General');
        }

        if (activeFolder === folderName) {
          activeFolder = 'All Notes';
        }

        save();
      }
    }

    /* ---------- MODAL: Buat / Edit Catatan ---------- */

    function openModal() {
      editingId = null;
      document.getElementById('modalTitleLabel').innerText = 'Catatan Baru';
      document.getElementById('qInput').value = '';
      document.getElementById('editor').innerHTML = '';

      const select = document.getElementById('folderSelect');
      if (activeFolder !== 'All Notes') {
        select.value = activeFolder;
      } else if (select.options.length > 0) {
        select.selectedIndex = 0;
      }

      document.getElementById('modalOverlay').classList.add('active');
      document.getElementById('qInput').focus();
    }

    function editNote(id) {
      const n = notes.find(item => item.id === id);
      if (!n) return;

      editingId = id;
      document.getElementById('modalTitleLabel').innerText = 'Edit Catatan';
      document.getElementById('qInput').value = n.question;
      document.getElementById('editor').innerHTML = n.answer;
      document.getElementById('folderSelect').value = n.folder;

      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
      editingId = null;
    }

    function execCmd(cmd) {
      document.execCommand(cmd, false, null);
      document.getElementById('editor').focus();
    }

    function saveNote() {
      const q = document.getElementById('qInput').value.trim();
      const content = document.getElementById('editor').innerHTML.trim();
      let f = document.getElementById('folderSelect').value;
      if (!f) f = 'General';

      if (!q) { alert('Pertanyaan / judul tidak boleh kosong!'); return; }

      if (editingId) {
        const n = notes.find(item => item.id === editingId);
        if (n) {
          n.question = q;
          n.answer = content;
          n.folder = f;
        }
      } else {
        const randomColor = COLOR_CLASSES[Math.floor(Math.random() * COLOR_CLASSES.length)];
        notes.unshift({
          id: Date.now(),
          question: q,
          answer: content,
          folder: f,
          color: randomColor,
          date: new Date().toLocaleDateString('en-GB')
        });
      }

      closeModal();
      save();
    }

    /* ---------- NOTES LIST ---------- */

    function renderNotes() {
      const grid = document.getElementById('notesGrid');
      const title = document.getElementById('notesTitle');
      const search = document.getElementById('searchInput').value.toLowerCase();

      title.innerText = activeFolder === 'All Notes' ? 'My Notes (All)' : `My Notes: ${activeFolder}`;
      grid.innerHTML = '';

      let list = activeFolder === 'All Notes' ? notes : notes.filter(n => n.folder === activeFolder);

      if (search) {
        list = list.filter(n =>
          n.question.toLowerCase().includes(search) ||
          stripHtml(n.answer).toLowerCase().includes(search)
        );
      }

      if (list.length === 0) {
        grid.innerHTML = '<div style="color: var(--text-muted); grid-column: 1/-1;">Belum ada catatan di folder ini.</div>';
        return;
      }

      list.forEach(n => {
        const el = document.createElement('div');
        el.className = `note-card ${n.color || 'card-blue'}`;
        el.style.backgroundColor = getBgColor(n.color);
        el.innerHTML = `
          <div>
            <div class="note-tag">${escapeHtml(n.folder)} • ${n.date}</div>
            <div class="note-q">${escapeHtml(n.question)}</div>
          </div>
          <div>
            <div class="note-content">${n.answer || ''}</div>
            <div class="note-foot">
              <span>ID: ${n.id.toString().slice(-4)}</span>
              <div class="note-foot-actions">
                <button class="btn-edit-note" onclick="editNote(${n.id})">Edit</button>
                <button class="btn-delete-note" onclick="deleteNote(${n.id})">Hapus Note</button>
              </div>
            </div>
          </div>
        `;
        grid.appendChild(el);
      });
    }

    function deleteNote(id) {
      if (confirm('Hapus catatan ini?')) {
        notes = notes.filter(n => n.id !== id);
        save();
      }
    }

    function render() {
      renderFolders();
      renderNotes();
    }

    function getBgColor(cls) {
      if (cls === 'card-pink') return '#ffe4e6';
      if (cls === 'card-yellow') return '#fef08a';
      if (cls === 'card-green') return '#dcfce7';
      return '#dbeafe';
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function stripHtml(html) {
      const tmp = document.createElement('div');
      tmp.innerHTML = html || '';
      return tmp.textContent || tmp.innerText || '';
    }

    /* ---------- EXPORT / IMPORT ---------- */

    function exportPDF(targetFolder) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      const list = (!targetFolder || targetFolder === 'All Notes')
        ? notes
        : notes.filter(n => n.folder === targetFolder);

      if (list.length === 0) {
        alert('Tidak ada catatan untuk diekspor pada folder ini.');
        return;
      }

      const marginX = 14;
      let y = 18;
      const pageHeight = doc.internal.pageSize.getHeight();

      doc.setFontSize(16);
      doc.text(`Mino Notes - ${targetFolder || 'All Notes'}`, marginX, y);
      y += 10;
      doc.setFontSize(10);

      list.forEach((n, idx) => {
        const qLines = doc.splitTextToSize(`${idx + 1}. ${n.question} (${n.folder} • ${n.date})`, 180);
        const aLines = doc.splitTextToSize(stripHtml(n.answer) || '-', 180);

        const blockHeight = (qLines.length + aLines.length) * 5 + 8;
        if (y + blockHeight > pageHeight - 15) {
          doc.addPage();
          y = 18;
        }

        doc.setFont(undefined, 'bold');
        doc.text(qLines, marginX, y);
        y += qLines.length * 5 + 2;

        doc.setFont(undefined, 'normal');
        doc.text(aLines, marginX, y);
        y += aLines.length * 5 + 6;
      });

      doc.save(`mino_notes_${(targetFolder || 'all').replace(/\s+/g, '_')}_${Date.now()}.pdf`);
    }

    function exportJSON() {
      if (!notes.length) { alert('Data kosong.'); return; }
      const payload = { notes, folders };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `mino_notes_backup_${Date.now()}.json`;
      a.click();
    }

    function importJSON(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (evt) => {
        try {
          const imported = JSON.parse(evt.target.result);
          if (Array.isArray(imported)) {
            notes = imported;
          } else if (imported && Array.isArray(imported.notes)) {
            notes = imported.notes;
            if (Array.isArray(imported.folders)) folders = imported.folders;
          } else {
            throw new Error('Format tidak dikenali');
          }
          save();
          alert('Import berhasil!');
        } catch { alert('File JSON tidak valid.'); }
      };
      reader.readAsText(file);
      e.target.value = '';
    }
  </script>
</body>
</html>
