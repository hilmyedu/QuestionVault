<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Mino Notes</title>

<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
  :root {
    --paper: #efe8d8;
    --paper-raised: #f8f4ea;
    --ink: #211d17;
    --ink-soft: #6b6455;
    --line: #211d17;
    --line-soft: #c9c0a9;
    --danger: #8a3324;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Space Grotesk', sans-serif; -webkit-tap-highlight-color: transparent; }
  html, body { overscroll-behavior-y: contain; }
  body { background-color: var(--paper); color: var(--ink); display: flex; height: 100vh; height: 100dvh; overflow: hidden; }
  button { touch-action: manipulation; font-family: inherit; }

  /* retro halftone dot strip, used sparingly as a signature texture */
  .dot-strip {
    height: 10px; flex-shrink: 0;
    background-image: radial-gradient(var(--ink) 1px, transparent 1.4px);
    background-size: 7px 7px;
    background-position: 0 -1px;
    opacity: 0.85;
  }

  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-track { background: var(--paper); }
  ::-webkit-scrollbar-thumb {
    background: repeating-linear-gradient(45deg, var(--ink), var(--ink) 3px, var(--paper-raised) 3px, var(--paper-raised) 6px);
    border: 2px solid var(--paper);
  }

  /* ---------------- Sidebar (desktop) ---------------- */
  aside { width: 250px; background: var(--paper-raised); padding: 0; display: flex; flex-direction: column; justify-content: space-between; border-right: 2px solid var(--line); flex-shrink: 0; }
  .win-dots { display: flex; gap: 7px; padding: 16px 18px 12px; }
  .win-dots span { width: 11px; height: 11px; border-radius: 50%; background: var(--ink); display: block; }
  .win-dots span:nth-child(2) { opacity: .55; }
  .win-dots span:nth-child(3) { opacity: .25; }

  .brand { font-weight: 700; font-size: 19px; letter-spacing: -0.02em; padding: 0 18px 14px; border-bottom: 2px solid var(--line); }
  .brand small { display: block; font-size: 10.5px; font-weight: 600; color: var(--ink-soft); letter-spacing: 0.06em; margin-top: 2px; }

  .nav-menu { list-style: none; display: flex; flex-direction: column; padding: 10px 10px; }
  .nav-item { padding: 10px 10px; font-size: 13.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer; display: flex; align-items: center; gap: 10px; border: 2px solid transparent; }
  .nav-item.active { background: var(--ink); color: var(--paper-raised); }

  .sidebar-foot { padding: 12px 18px; border-top: 2px solid var(--line); font-size: 10.5px; font-weight: 600; color: var(--ink-soft); letter-spacing: 0.04em; }

  /* ---------------- Sidebar folder list (channel-style nav) ---------------- */
  .side-scroll { flex-grow: 1; overflow-y: auto; padding-bottom: 10px; }
  .side-section-head { display: flex; align-items: center; gap: 9px; padding: 14px 18px 10px; font-size: 13.5px; font-weight: 700; color: var(--ink); cursor: pointer; user-select: none; }
  .side-caret { width: 15px; height: 15px; border: 2px solid var(--ink); display: inline-flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; line-height: 1; flex-shrink: 0; }
  .side-folder-icon { font-size: 14px; }
  .channel-list { list-style: none; padding: 0 10px 0 26px; display: flex; flex-direction: column; gap: 1px; position: relative; }
  .channel-list.collapsed { display: none; }
  .channel-list::before { content: ''; position: absolute; left: 20px; top: 2px; bottom: 14px; width: 1px; background: var(--line-soft); }
  .channel-item { position: relative; display: flex; align-items: center; gap: 7px; padding: 7px 10px 7px 12px; font-size: 13.5px; font-weight: 600; color: var(--ink-soft); cursor: pointer; }
  .channel-item::before { content: ''; position: absolute; left: -6px; top: 50%; width: 8px; height: 1px; background: var(--line-soft); }
  .channel-item:hover { color: var(--ink); }
  .channel-item.active { color: var(--paper-raised); font-weight: 700; background: var(--ink); margin-left: -26px; padding-left: 38px; width: calc(100% + 26px); }
  .channel-item.active::before { display: none; }
  .channel-hash { flex-shrink: 0; opacity: .75; font-weight: 700; }
  .channel-name { flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .channel-badge { background: var(--ink); color: var(--paper-raised); font-size: 10.5px; font-weight: 700; border-radius: 999px; padding: 1px 7px; flex-shrink: 0; }
  .channel-item.active .channel-badge { background: var(--paper-raised); color: var(--ink); }
  .channel-del { display: none; background: none; border: none; color: var(--ink-soft); font-size: 12px; font-weight: 700; cursor: pointer; padding: 3px 4px; flex-shrink: 0; }
  .channel-item:hover .channel-del { display: block; }
  .channel-item:hover .channel-badge { display: none; }
  .channel-item.active .channel-del { color: var(--paper-raised); }
  .channel-del:hover { color: var(--danger); }
  .channel-add { display: flex; align-items: center; gap: 7px; padding: 7px 10px 7px 12px; font-size: 13px; font-weight: 600; color: var(--ink-soft); cursor: pointer; position: relative; }
  .channel-add::before { content: ''; position: absolute; left: -6px; top: 50%; width: 8px; height: 1px; background: var(--line-soft); }
  .channel-add:hover { color: var(--ink); }

  /* Notes nested under the active folder, tree-style */
  .channel-notes { list-style: none; margin: 2px 0 6px 20px; padding-left: 12px; border-left: 1px solid var(--line-soft); display: flex; flex-direction: column; gap: 1px; }
  .channel-note-item { font-size: 12px; font-weight: 600; color: var(--ink-soft); cursor: pointer; padding: 5px 8px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; position: relative; }
  .channel-note-item::before { content: '·'; margin-right: 6px; opacity: .6; }
  .channel-note-item:hover { color: var(--ink); background: var(--paper); }
  .channel-note-item.add { font-style: italic; opacity: .85; }
  .channel-note-item.empty { font-style: italic; opacity: .6; cursor: default; }
  .channel-note-item.empty:hover { background: none; color: var(--ink-soft); }

  .mobile-topbar { display: none; }

  #app { flex-grow: 1; display: flex; flex-direction: column; height: 100vh; height: 100dvh; overflow: hidden; min-width: 0; }

  header { min-height: 62px; background: var(--paper-raised); border-bottom: 2px solid var(--line); display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 28px; flex-shrink: 0; flex-wrap: nowrap; }
  .search-box { background: var(--paper); padding: 9px 14px; border-radius: 0; border: 2px solid var(--line); flex: 1 1 160px; min-width: 90px; max-width: 280px; font-size: 13.5px; font-weight: 600; outline: none; color: var(--ink); }
  .search-box::placeholder { color: var(--ink-soft); font-weight: 500; }

  .profile-area { position: relative; }
  .profile-btn { display: flex; align-items: center; gap: 9px; background: none; border: 2px solid var(--line); cursor: pointer; padding: 6px 12px; border-radius: 0; transition: background 0.15s; min-height: 42px; flex-shrink: 0; }
  .profile-btn:hover { background: var(--ink); color: var(--paper-raised); }
  .profile-btn .profile-label { white-space: nowrap; font-size: 12.5px; font-weight: 700; }
  .avatar { width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: var(--paper-raised); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
  .profile-btn:hover .avatar { background: var(--paper-raised); color: var(--ink); }

  .dropdown-menu { position: absolute; right: 0; top: 52px; background: var(--paper-raised); border: 2px solid var(--line); border-radius: 0; width: 240px; box-shadow: 5px 5px 0 var(--ink); display: none; flex-direction: column; padding: 6px; z-index: 200; }
  .dropdown-menu.show { display: flex; }
  .dropdown-item { padding: 11px 12px; font-size: 12.5px; font-weight: 700; color: var(--ink); border-radius: 0; cursor: pointer; display: flex; align-items: center; gap: 10px; border: none; background: none; width: 100%; text-align: left; min-height: 42px; }
  .dropdown-item:hover { background: var(--ink); color: var(--paper-raised); }
  .dropdown-divider { height: 2px; background: var(--line); margin: 4px 0; }

  .sheet-backdrop { position: fixed; inset: 0; background: rgba(33,29,23,0.45); z-index: 150; opacity: 0; pointer-events: none; transition: opacity .2s ease; }
  .sheet-backdrop.show { opacity: 1; pointer-events: auto; }

  .content-area { flex-grow: 1; padding: 22px 28px 32px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .section-title { font-size: 13px; font-weight: 700; margin-bottom: 12px; color: var(--ink); text-transform: none; }

  /* ---------------- Folders (rendered like a channel rail) ---------------- */
  .folder-pagination-wrapper { display: flex; align-items: center; gap: 8px; margin-bottom: 20px; }
  .btn-nav-arrow { background: var(--paper-raised); border: 2px solid var(--line); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: bold; flex-shrink: 0; user-select: none; }
  .btn-nav-arrow:hover:not(:disabled) { background: var(--ink); color: var(--paper-raised); }
  .btn-nav-arrow:disabled { opacity: 0.3; cursor: not-allowed; }
  .folders-grid { display: grid; grid-template-columns: repeat(var(--folder-cols, 5), 1fr); gap: 12px; flex-grow: 1; min-width: 0; }

  .folder-card { background: var(--paper-raised); border-radius: 0; padding: 12px; cursor: pointer; border: 2px solid var(--line); transition: transform 0.1s; box-shadow: 3px 3px 0 var(--ink); display: flex; flex-direction: column; justify-content: space-between; min-height: 100px; position: relative; }
  .folder-card:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--ink); }
  .folder-card.active { background: var(--ink); color: var(--paper-raised); box-shadow: 3px 3px 0 var(--line-soft); }
  .folder-card.active .folder-count { color: var(--paper); opacity: .7; }
  .folder-top { display: flex; justify-content: space-between; align-items: center; }
  .folder-icon { width: 28px; height: 28px; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .btn-delete-folder { background: none; border: none; color: var(--ink-soft); font-size: 14px; font-weight: bold; cursor: pointer; padding: 5px; border-radius: 0; line-height: 1; transition: all 0.15s; min-width: 28px; min-height: 28px; }
  .btn-delete-folder:hover { color: var(--paper-raised); background: var(--danger); }
  .folder-name { font-weight: 700; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .folder-count { font-size: 10.5px; color: var(--ink-soft); font-weight: 600; }
  .folder-add-btn { border: 2px dashed var(--line); background: transparent; align-items: center; justify-content: center; gap: 4px; box-shadow: none; }
  .folder-add-btn:hover { transform: none; box-shadow: none; background: var(--paper); }

  /* ---------------- Sub Bab ---------------- */
  .subbab-section { background: var(--paper-raised); border: 2px solid var(--line); border-radius: 0; padding: 16px 18px; margin-bottom: 20px; }
  .subbab-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; gap: 12px; flex-wrap: wrap; }
  .subbab-header h3 { font-size: 13px; font-weight: 700; color: var(--ink); }
  .btn-folder-download { font-size: 11.5px; font-weight: 700; color: var(--ink); background: var(--paper); border: 2px solid var(--line); padding: 8px 13px; border-radius: 0; cursor: pointer; white-space: nowrap; min-height: 38px; }
  .btn-folder-download:hover { background: var(--ink); color: var(--paper-raised); }
  .subbab-pills { display: flex; flex-wrap: wrap; gap: 8px; }
  .subbab-pill { display: flex; align-items: center; gap: 6px; background: var(--paper); border: 2px solid var(--line); border-radius: 0; padding: 7px 7px 7px 13px; font-size: 12px; font-weight: 700; color: var(--ink); cursor: pointer; transition: all .15s; min-height: 38px; }
  .subbab-pill.active { background: var(--ink); color: var(--paper-raised); }
  .subbab-pill .pill-count { color: var(--ink-soft); font-weight: 600; }
  .subbab-pill.active .pill-count { color: var(--paper); opacity: .75; }
  .subbab-pill .pill-icon-btn { background: none; border: none; cursor: pointer; font-size: 12px; padding: 5px 6px; border-radius: 0; line-height: 1; color: inherit; opacity: .6; min-width: 28px; min-height: 28px; }
  .subbab-pill .pill-icon-btn:hover { opacity: 1; }
  .subbab-pill .pill-icon-btn.danger:hover { color: var(--danger); }
  .subbab-pill.add-pill { border-style: dashed; color: var(--ink-soft); padding: 7px 15px; }

  .new-note-trigger { margin-bottom: 20px; }
  .btn-submit { background: var(--ink); color: var(--paper-raised); border: 2px solid var(--line); padding: 12px 20px; border-radius: 0; font-weight: 700; cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 8px; box-shadow: 3px 3px 0 var(--line-soft); }
  .btn-submit:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--line-soft); }

  .fab { display: none; }

  /* ---------------- Note cards, styled like a message thread ---------------- */
  .notes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 18px; padding: 4px 2px 20px; }

  .note-card { background: var(--paper-raised); border-radius: 0; overflow: hidden; border: 2px solid var(--line); box-shadow: 4px 4px 0 var(--line-soft); cursor: pointer; transition: transform .12s ease, box-shadow .12s ease; display: flex; flex-direction: column; }
  .note-card:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--line-soft); }
  .note-card:active { transform: translate(0,0); box-shadow: 2px 2px 0 var(--line-soft); }

  .note-card-topbar { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 2px solid var(--line); }
  .note-card-icon { width: 28px; height: 28px; border: 2px solid var(--ink); background: var(--paper-raised); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
  .note-card-folder-name { font-size: 11.5px; font-weight: 700; flex-grow: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; letter-spacing: 0.02em; }

  .note-menu-btn { background: none; border: 2px solid transparent; width: 28px; height: 28px; border-radius: 0; font-size: 15px; font-weight: 700; cursor: pointer; flex-shrink: 0; color: inherit; line-height: 1; }
  .note-menu-btn:hover { border-color: var(--ink); }

  .note-card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
  .note-title { font-weight: 700; font-size: 15px; color: var(--ink); line-height: 1.35; font-family: 'Space Grotesk', sans-serif; }
  .note-preview { font-family: 'Source Serif 4', serif; font-size: 13.5px; color: var(--ink-soft); line-height: 21px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .note-preview:empty:before, .note-preview.is-empty:before { content: 'Belum ada jawaban. Ketuk untuk menulis.'; color: var(--ink-soft); font-style: italic; }
  .note-card-foot { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 10px; font-size: 10.5px; color: var(--ink-soft); font-weight: 600; border-top: 1px solid var(--line-soft); }

  /* ---------------- Note action menu ---------------- */
  .note-action-menu { position: fixed; background: var(--paper-raised); border: 2px solid var(--line); border-radius: 0; min-width: 172px; box-shadow: 4px 4px 0 var(--ink); display: none; flex-direction: column; padding: 6px; z-index: 400; }
  .note-action-menu.show { display: flex; }
  .note-action-menu button { padding: 10px 12px; font-size: 12.5px; font-weight: 700; color: var(--ink); border-radius: 0; cursor: pointer; display: flex; align-items: center; gap: 9px; border: none; background: none; width: 100%; text-align: left; }
  .note-action-menu button:hover { background: var(--ink); color: var(--paper-raised); }
  .note-action-menu button.danger { color: var(--danger); }
  .note-action-menu button.danger:hover { background: var(--danger); color: var(--paper-raised); }

  /* ---------------- Read modal ---------------- */
  .read-page { background: var(--paper-raised); display: flex; flex-direction: column; max-height: 74vh; overflow: hidden; }
  .read-header { padding: 16px 22px; display: flex; align-items: center; gap: 12px; border-bottom: 2px solid var(--line); }
  .read-icon { width: 38px; height: 38px; border: 2px solid var(--ink); background: var(--paper-raised); display: flex; align-items: center; justify-content: center; font-size: 17px; font-weight: 700; flex-shrink: 0; }
  .read-folder-name { font-size: 11.5px; font-weight: 700; letter-spacing: 0.03em; }
  .read-date { font-size: 10.5px; opacity: 0.75; margin-top: 2px; font-weight: 600; }
  .read-body { padding: 20px 22px; overflow-y: auto; }
  .read-q { font-weight: 700; font-size: 19px; color: var(--ink); line-height: 1.4; margin-bottom: 14px; font-family: 'Space Grotesk', sans-serif; }
  .read-answer { font-family: 'Source Serif 4', serif; font-size: 15px; color: var(--ink); line-height: 27px; min-height: 60px; }
  .read-answer:empty:before { content: 'Belum ada jawaban.'; color: var(--ink-soft); font-style: italic; }
  .read-meta { font-size: 10.5px; color: var(--ink-soft); font-weight: 600; margin-top: 16px; padding-top: 10px; border-top: 1px solid var(--line-soft); }

  /* ---------------- Modal shell ---------------- */
  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(33,29,23,0.5); display: flex; align-items: center; justify-content: center; padding: 16px; opacity: 0; pointer-events: none; transition: opacity 0.2s ease; z-index: 999; }
  .modal-overlay.active { opacity: 1; pointer-events: auto; }
  .modal { background: var(--paper-raised); border-radius: 0; width: 100%; max-width: 480px; padding: 20px; display: flex; flex-direction: column; gap: 12px; box-shadow: 8px 8px 0 var(--ink); max-height: 90vh; overflow-y: auto; border: 2px solid var(--line); }
  .modal.small-modal { max-width: 360px; }
  .modal.read-shell { padding: 0; max-width: 480px; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14.5px; padding-bottom: 10px; border-bottom: 2px solid var(--line); }
  .modal-header span.close-x { cursor: pointer; font-size: 20px; color: var(--ink-soft); padding: 4px; min-width: 30px; min-height: 30px; display: flex; align-items: center; justify-content: center; }
  .modal-header span.close-x:hover { color: var(--ink); }
  .read-close-row { display: flex; justify-content: flex-end; padding: 10px 14px 0; }
  .read-close-row .close-x { cursor: pointer; font-size: 20px; color: var(--ink-soft); }

  .modal input[type="text"], .modal select { width: 100%; background: var(--paper); border: 2px solid var(--line); border-radius: 0; padding: 11px 13px; font-size: 16px; font-weight: 600; outline: none; color: var(--ink); }

  .toolbar { display: flex; gap: 2px; background: var(--paper); border: 2px solid var(--line); border-bottom: none; border-radius: 0; padding: 4px; flex-wrap: wrap; }
  .toolbar button { background: transparent; border: none; padding: 6px 8px; font-size: 12px; border-radius: 0; cursor: pointer; color: var(--ink); min-width: 34px; min-height: 34px; white-space: nowrap; }
  .toolbar button:hover { background: var(--ink); color: var(--paper-raised); }
  .editor { background: var(--paper); border: 2px solid var(--line); border-radius: 0; padding: 12px; min-height: 140px; max-height: 260px; overflow-y: auto; outline: none; font-size: 15px; font-family: 'Source Serif 4', serif; line-height: 1.6; }
  .editor[placeholder]:empty:before { content: attr(placeholder); color: var(--ink-soft); font-style: italic; }
  .editor ul, .editor ol, .read-answer ul, .read-answer ol, .note-preview ul, .note-preview ol { padding-left: 24px; margin: 8px 0; }
  .editor li, .read-answer li, .note-preview li { margin-bottom: 4px; }

  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .btn-cancel { background: var(--paper-raised); border: 2px solid var(--line); border-radius: 0; padding: 11px 17px; font-weight: 700; font-size: 12.5px; cursor: pointer; color: var(--ink); min-height: 42px; }
  .btn-cancel:hover { background: var(--paper); }
  .btn-save { background: var(--ink); color: var(--paper-raised); border: 2px solid var(--line); border-radius: 0; padding: 11px 17px; font-weight: 700; font-size: 12.5px; cursor: pointer; min-height: 42px; }
  .btn-save:hover { box-shadow: 3px 3px 0 var(--line-soft); }

  .empty-state { color: var(--ink-soft); grid-column: 1/-1; text-align: center; padding: 44px 16px; font-size: 13.5px; font-weight: 600; border: 2px dashed var(--line-soft); }

  /* On desktop the sidebar nav is the folder switcher, so the in-content
     folder cards would just duplicate it. Keep the cards for mobile only. */
  @media (min-width: 481px) {
    .folder-pagination-wrapper { display: none; }
  }

  /* ===================== Narrow desktop windows ===================== */
  @media (max-width: 1000px) {
    header { padding: 10px 18px; }
    .content-area { padding: 18px 18px 28px; }
  }

  /* ===================== MOBILE ===================== */
  @media (max-width: 480px) {
    body { flex-direction: column; }
    aside { display: none; }

    .mobile-topbar { display: flex; align-items: center; justify-content: space-between; padding: calc(10px + var(--safe-t)) 16px 10px; background: var(--paper-raised); border-bottom: 2px solid var(--line); flex-shrink: 0; }
    .mobile-topbar .win-dots { padding: 0; }
    .mobile-topbar .brand-wrap { display: flex; align-items: center; gap: 10px; }
    .mobile-topbar .brand { font-size: 16px; padding: 0; border: none; }

    header { padding: 8px 14px; gap: 8px; }
    .search-box { font-size: 16px; min-width: 0; }
    .profile-btn .profile-label { display: none; }
    .content-area { padding: 14px 14px calc(90px + var(--safe-b)); }

    .folder-pagination-wrapper { gap: 0; }
    .btn-nav-arrow { display: none; }
    .folders-grid { display: flex; grid-template-columns: none; overflow-x: auto; scroll-snap-type: x proximity; -webkit-overflow-scrolling: touch; padding-bottom: 4px; gap: 10px; }
    .folder-card { flex: 0 0 40%; scroll-snap-align: start; min-height: 92px; }

    .new-note-trigger { display: none; }

    .fab { display: flex; align-items: center; justify-content: center; gap: 8px; position: fixed; right: 18px; bottom: calc(20px + var(--safe-b)); z-index: 120; background: var(--ink); color: var(--paper-raised); border: 2px solid var(--line); border-radius: 0; padding: 15px 19px; font-weight: 700; font-size: 13.5px; box-shadow: 4px 4px 0 var(--line-soft); cursor: pointer; }
    .fab:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--line-soft); }

    .notes-grid { grid-template-columns: 1fr; gap: 10px; }
    .note-card { flex-direction: row; align-items: center; gap: 12px; border-radius: 0; padding: 10px 10px; }
    .note-card:hover { transform: none; }
    .note-card .card-desktop { display: none; }
    .note-card .card-mobile { display: flex; align-items: center; gap: 12px; width: 100%; }
    .mobile-icon { width: 42px; height: 42px; border: 2px solid var(--ink); display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; flex-shrink: 0; }
    .mobile-text { flex: 1; min-width: 0; }
    .mobile-title { font-weight: 700; font-size: 13.5px; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .mobile-meta { font-size: 11.5px; color: var(--ink-soft); font-weight: 600; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .modal-overlay { align-items: flex-end; padding: 0; }
    .modal, .read-shell { max-width: 100%; border-radius: 0; max-height: 88vh; padding-bottom: calc(20px + var(--safe-b)); box-shadow: none; border-top: 2px solid var(--line); border-left: none; border-right: none; border-bottom: none; }
    .modal.small-modal { max-width: 100%; }
    .modal:not(.read-shell)::before { content: ''; display: block; width: 40px; height: 4px; background: var(--line-soft); margin: -6px auto 4px; }

    .dropdown-menu { position: fixed; left: 0; right: 0; bottom: 0; top: auto; width: 100%; border-radius: 0; padding: 10px 10px calc(14px + var(--safe-b)); box-shadow: none; border-top: 2px solid var(--line); border-left: none; border-right: none; border-bottom: none; }
    .dropdown-item { font-size: 14px; padding: 14px; }
  }

  .card-mobile { display: none; }
</style>
</head>
<body>

<aside>
  <div class="side-scroll">
    <div class="win-dots"><span></span><span></span><span></span></div>
    <div class="brand">Mino Notes<small>Personal note archive</small></div>
    <div class="side-section-head" onclick="toggleSidebarFolders()">
      <span class="side-caret" id="sidebarCaret">−</span>
      <span class="side-folder-icon">🗀</span> Folders
    </div>
    <ul class="channel-list" id="sidebarFolderList"></ul>
  </div>
  <div class="sidebar-foot" id="storageStatusDesktop">Menyimpan...</div>
</aside>

<div id="app">
  <div class="mobile-topbar">
    <div class="brand-wrap">
      <div class="win-dots"><span></span><span></span><span></span></div>
      <div class="brand">Mino Notes</div>
    </div>
    <span id="storageStatusMobile" style="font-size:11px;font-weight:700;color:var(--ink-soft);">⏳</span>
  </div>

  <header>
    <input type="text" id="searchInput" class="search-box" placeholder="Cari catatan..." oninput="renderNotes()">
    <div class="profile-area">
      <button class="profile-btn" onclick="toggleProfileMenu(event)">
        <div class="avatar">M</div>
        <span class="profile-label">Profile ▾</span>
      </button>
      <div class="dropdown-menu" id="profileDropdown">
        <button class="dropdown-item" onclick="exportPDF('All Notes','All')">⬇ Unduh Semua (PDF)</button>
        <button class="dropdown-item" onclick="exportPDF(activeFolder,'All')">⬇ Unduh Folder Ini (PDF)</button>
        <div class="dropdown-divider"></div>
        <button class="dropdown-item" onclick="exportJSON()">▤ Export JSON</button>
        <label class="dropdown-item" style="cursor: pointer;">
          ▢ Import JSON
          <input type="file" id="importFile" accept=".json" onchange="importJSON(event)" style="display:none;">
        </label>
      </div>
    </div>
  </header>

  <div class="dot-strip"></div>

  <div class="sheet-backdrop" id="sheetBackdrop" onclick="closeAllSheets()"></div>

  <div class="content-area">
    <h2 class="section-title">Folders / Categories</h2>
    <div class="folder-pagination-wrapper">
      <button class="btn-nav-arrow" id="btnPrevFolder" onclick="changeFolderPage(-1)">◀</button>
      <div class="folders-grid" id="foldersContainer"></div>
      <button class="btn-nav-arrow" id="btnNextFolder" onclick="changeFolderPage(1)">▶</button>
    </div>

    <div class="new-note-trigger">
      <button class="btn-submit" onclick="openModal()">+ Buat Catatan Baru</button>
    </div>

    <div class="subbab-section" id="subbabSectionContainer" style="display:none;"></div>

    <h2 class="section-title" id="notesTitle">My Notes</h2>
    <div class="notes-grid" id="notesGrid"></div>
  </div>

  <button class="fab" onclick="openModal()">✎ Catatan Baru</button>
</div>

<!-- Shared per-note action menu -->
<div class="note-action-menu" id="noteActionMenu">
  <button onclick="noteMenuAction('view')">👁 Lihat Catatan</button>
  <button onclick="noteMenuAction('edit')">✎ Edit</button>
  <button onclick="noteMenuAction('download')">⬇ Unduh PDF</button>
  <button class="danger" onclick="noteMenuAction('delete')">✖ Hapus</button>
</div>

<!-- Modal Rich-Text Editor -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <div class="modal-header">
      <span id="modalTitleLabel">Catatan Baru</span>
      <span class="close-x" onclick="closeModal()">&times;</span>
    </div>
    <input type="text" id="qInput" placeholder="Tulis pertanyaan / judul...">
    <select id="folderSelect" onchange="onModalFolderChange()"></select>
    <select id="subbabSelect" onchange="onModalSubbabChange()"></select>
    <div>
      <div class="toolbar">
        <button type="button" title="Bold" onclick="execCmd('bold')"><b>B</b></button>
        <button type="button" title="Italic" onclick="execCmd('italic')"><i>I</i></button>
        <button type="button" title="Underline" onclick="execCmd('underline')"><u>U</u></button>
        <button type="button" title="Strikethrough" onclick="execCmd('strikeThrough')"><s>S</s></button>
        <button type="button" title="Bullet List" onclick="execCmd('insertUnorderedList')">• List</button>
        <button type="button" title="Numbered List" onclick="execCmd('insertOrderedList')">1. List</button>
      </div>
      <div id="editor" class="editor" contenteditable="true" placeholder="Tulis isi jawaban/refleksi di sini..."></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Batal</button>
      <button class="btn-save" onclick="saveNote()">Simpan Catatan</button>
    </div>
  </div>
</div>

<!-- Modal: baca catatan -->
<div class="modal-overlay" id="readOverlay">
  <div class="modal read-shell">
    <div class="read-page" id="readPageContent"></div>
    <div class="modal-actions" style="padding:14px;">
      <button class="btn-cancel" id="readDeleteBtn">Hapus</button>
      <button class="btn-cancel" id="readDownloadBtn" style="color:#3f5930; border-color:#3f5930;">⬇ Unduh PDF</button>
      <button class="btn-save" id="readEditBtn">Edit Catatan</button>
    </div>
  </div>
</div>

<!-- Modal input generik (Tambah Folder / Tambah Sub Bab) -->
<div class="modal-overlay" id="inputModalOverlay">
  <div class="modal small-modal">
    <div class="modal-header">
      <span id="inputModalTitleLabel">Tambah</span>
      <span class="close-x" onclick="closeInputModal()">&times;</span>
    </div>
    <input type="text" id="inputModalField" placeholder="">
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeInputModal()">Batal</button>
      <button class="btn-save" onclick="confirmInputModal()">Simpan</button>
    </div>
  </div>
</div>

<script>
  const DATA_KEY = 'mino_notes_data_v2';

  // Visual theme per folder: muted retro tones + a matching glyph icon.
  // Falls back to a hash-based pick for custom folders. This does not
  // affect the stored JSON shape (notes/folders/folderSubbabs) at all.
  const FOLDER_ICON_MAP = { 'Movie Review': '▶', 'Class Notes': '▦', 'Book Lists': '≡', 'Tech & Code': '</>', 'General': '#' };
  const FALLBACK_ICONS = ['#', '◆', '★', '●', '▣', '✎', '▢', '✦', '◎', '❀'];
  const THEMES = [
    { bg: '#e8c4b8', text: '#7a2e1d' },
    { bg: '#c9d6c3', text: '#3f5930' },
    { bg: '#e3d5a8', text: '#7a5c17' },
    { bg: '#c7d1d9', text: '#33465a' },
    { bg: '#d9c2d9', text: '#5c3566' },
    { bg: '#f0c9c0', text: '#8a3324' },
    { bg: '#c3dbd9', text: '#2c5c56' },
    { bg: '#e8dcc0', text: '#6b5a2e' },
  ];

  function hashStr(str) { let h = 0; for (let i = 0; i < str.length; i++) h = str.charCodeAt(i) + ((h << 5) - h); return Math.abs(h); }
  function themeFor(folderName) { return THEMES[hashStr(folderName || 'General') % THEMES.length]; }
  function iconFor(folderName) {
    if (FOLDER_ICON_MAP[folderName]) return FOLDER_ICON_MAP[folderName];
    return FALLBACK_ICONS[hashStr(folderName || 'General') % FALLBACK_ICONS.length];
  }

  let notes = [];
  let folders = ['All Notes', 'Movie Review', 'Class Notes', 'Book Lists', 'Tech & Code'];
  let folderSubbabs = {};
  let activeFolder = 'All Notes';
  let activeSubbab = 'All';
  let folderCurrentPage = 0;
  let editingId = null;
  let readingId = null;
  let inputModalCallback = null;
  let noteMenuTargetId = null;
  let dataLoaded = false;
  let sidebarFoldersCollapsed = false;

  function isMobile() { return window.innerWidth <= 480; }

  function getFoldersPerPage() {
    if (isMobile()) return folders.length; // horizontal scroll shows them all, no js pagination needed
    const wrapper = document.querySelector('.folder-pagination-wrapper');
    const availableWidth = wrapper ? wrapper.clientWidth - 100 : window.innerWidth - 120;
    const count = Math.floor(availableWidth / 165);
    return Math.max(2, Math.min(6, count));
  }

  function setStorageStatus(text) {
    const a = document.getElementById('storageStatusDesktop');
    const b = document.getElementById('storageStatusMobile');
    if (a) a.innerText = text;
    if (b) b.innerText = text.includes('✓') ? '✓' : (text.includes('⏳') ? '⏳' : '⚠');
  }

  document.addEventListener('DOMContentLoaded', async () => {
    setStorageStatus('⏳ Memuat...');
    await loadData();
    dataLoaded = true;
    setStorageStatus('✓ Tersimpan');
    render();

    document.addEventListener('click', (e) => {
      if (!e.target.closest('.profile-area')) closeAllSheets();
      if (!e.target.closest('.note-menu-btn') && !e.target.closest('.note-action-menu')) closeNoteMenu();
    });

    window.addEventListener('resize', () => { renderFolders(); });

    document.getElementById('inputModalField').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); confirmInputModal(); }
    });

    document.querySelectorAll('.modal-overlay').forEach(ov => {
      ov.addEventListener('click', (e) => { if (e.target === ov) {
        if (ov.id === 'modalOverlay') closeModal();
        if (ov.id === 'readOverlay') closeReadModal();
        if (ov.id === 'inputModalOverlay') closeInputModal();
      }});
    });
  });

  /* ---------- PERSISTENCE ---------- */
  async function loadData() {
    try {
      const res = await window.storage.get(DATA_KEY, false);
      if (res && res.value) {
        const parsed = JSON.parse(res.value);
        notes = parsed.notes || [];
        if (Array.isArray(parsed.folders) && parsed.folders.length) folders = parsed.folders;
        folderSubbabs = parsed.folderSubbabs || {};
      }
    } catch (e) { /* belum ada data tersimpan */ }

    const customFoldersFromNotes = [...new Set(notes.map(n => n.folder))];
    customFoldersFromNotes.forEach(f => { if (f && !folders.includes(f)) folders.push(f); });

    notes.forEach(n => {
      if (n.subbab) {
        if (!folderSubbabs[n.folder]) folderSubbabs[n.folder] = [];
        if (!folderSubbabs[n.folder].includes(n.subbab)) folderSubbabs[n.folder].push(n.subbab);
      }
    });
  }

  async function persist() {
    setStorageStatus('⏳ Menyimpan...');
    try {
      const result = await window.storage.set(DATA_KEY, JSON.stringify({ notes, folders, folderSubbabs }), false);
      setStorageStatus(result ? '✓ Tersimpan' : '⚠ Gagal simpan');
    } catch (e) { setStorageStatus('⚠ Gagal simpan'); console.error('Storage error:', e); }
  }

  function save() { render(); persist(); }

  /* ---------- SHEETS / MENUS ---------- */
  function toggleProfileMenu(e) {
    e.stopPropagation();
    const menu = document.getElementById('profileDropdown');
    const backdrop = document.getElementById('sheetBackdrop');
    const willShow = !menu.classList.contains('show');
    menu.classList.toggle('show', willShow);
    if (isMobile()) backdrop.classList.toggle('show', willShow);
  }
  function closeAllSheets() { document.getElementById('profileDropdown').classList.remove('show'); document.getElementById('sheetBackdrop').classList.remove('show'); }

  function openNoteMenu(e, id) {
    e.stopPropagation();
    noteMenuTargetId = id;
    const menu = document.getElementById('noteActionMenu');
    const rect = e.currentTarget.getBoundingClientRect();
    menu.style.display = 'flex'; // measure first
    const menuWidth = menu.offsetWidth || 170;
    let left = rect.right - menuWidth;
    if (left < 8) left = 8;
    let top = rect.bottom + 6;
    if (top + 180 > window.innerHeight) top = rect.top - 180;
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
    menu.classList.add('show');
  }
  function closeNoteMenu() { const m = document.getElementById('noteActionMenu'); m.classList.remove('show'); noteMenuTargetId = null; }
  function noteMenuAction(action) {
    const id = noteMenuTargetId;
    closeNoteMenu();
    if (!id) return;
    if (action === 'view') openReadModal(id);
    if (action === 'edit') editNote(id);
    if (action === 'download') exportSingleNotePDF(id);
    if (action === 'delete') deleteNote(id);
  }

  /* ---------- FOLDERS ---------- */
  function renderFolders() {
    const container = document.getElementById('foldersContainer');
    const select = document.getElementById('folderSelect');
    const prevBtn = document.getElementById('btnPrevFolder');
    const nextBtn = document.getElementById('btnNextFolder');

    const foldersPerPage = getFoldersPerPage();
    const totalPages = Math.ceil(folders.length / foldersPerPage) || 1;

    if (folderCurrentPage < 0) folderCurrentPage = 0;
    if (folderCurrentPage >= totalPages) folderCurrentPage = totalPages - 1;

    prevBtn.disabled = (folderCurrentPage === 0) || isMobile();
    nextBtn.disabled = (folderCurrentPage >= totalPages - 1) || isMobile();

    const startIndex = isMobile() ? 0 : folderCurrentPage * foldersPerPage;
    const visibleFolders = isMobile() ? folders : folders.slice(startIndex, startIndex + foldersPerPage);
    container.style.setProperty('--folder-cols', Math.min(6, visibleFolders.length + 1));

    let folderHTML = '';
    visibleFolders.forEach((f) => {
      const count = f === 'All Notes' ? notes.length : notes.filter(n => n.folder === f).length;
      const isDefaultFolder = (f === 'All Notes');
      const theme = isDefaultFolder ? { bg: '#efe8d8', text: '#211d17' } : themeFor(f);
      const icon = isDefaultFolder ? '▤' : iconFor(f);
      const deleteBtnHtml = isDefaultFolder ? '' : `<button class="btn-delete-folder" title="Hapus Folder" onclick="deleteFolder(event, '${jsEscape(f)}')">✖</button>`;
      const activeClass = activeFolder === f ? 'active' : '';
      const iconStyle = activeClass ? `border-color: var(--paper-raised); color: var(--paper-raised);` : `background:${theme.bg};color:${theme.text};border-color:${theme.text}`;

      folderHTML += `
        <div class="folder-card ${activeClass}" onclick="selectFolder('${jsEscape(f)}')">
          <div class="folder-top">
            <div class="folder-icon" style="${iconStyle}">${icon}</div>
            ${deleteBtnHtml}
          </div>
          <div>
            <div class="folder-name">${escapeHtml(f)}</div>
            <div class="folder-count">${count} notes</div>
          </div>
        </div>
      `;
    });

    folderHTML += `
      <div class="folder-card folder-add-btn" onclick="addCustomFolder()">
        <div style="font-size: 18px; font-weight: bold;">+</div>
        <div class="folder-name">New Folder</div>
      </div>
    `;

    container.innerHTML = folderHTML;

    const availableFoldersForSelect = folders.filter(f => f !== 'All Notes');
    select.innerHTML = availableFoldersForSelect.map(f => `<option value="${escapeHtml(f)}" ${f === activeFolder ? 'selected' : ''}>${escapeHtml(f)}</option>`).join('');
  }

  function changeFolderPage(dir) { folderCurrentPage += dir; renderFolders(); }
  function selectFolder(fName) { activeFolder = fName; activeSubbab = 'All'; render(); }

  /* ---------- SIDEBAR FOLDER NAV (desktop) ---------- */
  function toggleSidebarFolders() {
    sidebarFoldersCollapsed = !sidebarFoldersCollapsed;
    document.getElementById('sidebarCaret').innerText = sidebarFoldersCollapsed ? '+' : '−';
    document.getElementById('sidebarFolderList').classList.toggle('collapsed', sidebarFoldersCollapsed);
  }

  function renderSidebarFolders() {
    const list = document.getElementById('sidebarFolderList');
    let html = '';
    folders.forEach((f) => {
      const isDefaultFolder = (f === 'All Notes');
      const isActive = activeFolder === f;
      const folderNotes = isDefaultFolder ? notes : notes.filter(n => n.folder === f);
      const count = folderNotes.length;
      const hash = isDefaultFolder ? '▤' : '#';
      const delBtn = isDefaultFolder ? '' : `<button class="channel-del" title="Hapus folder" onclick="event.stopPropagation(); deleteFolder(event, '${jsEscape(f)}')">✖</button>`;
      html += `
        <li class="channel-item ${isActive ? 'active' : ''}" onclick="selectFolder('${jsEscape(f)}')">
          <span class="channel-hash">${hash}</span>
          <span class="channel-name">${escapeHtml(f)}</span>
          ${count > 0 ? `<span class="channel-badge">${count}</span>` : ''}
          ${delBtn}
        </li>
      `;
      // When this folder is the active one, list its notes nested right underneath it.
      if (isActive) {
        html += `<ul class="channel-notes">`;
        if (folderNotes.length === 0) {
          html += `<li class="channel-note-item empty">Belum ada catatan</li>`;
        } else {
          folderNotes.slice(0, 8).forEach(n => {
            html += `<li class="channel-note-item" title="${escapeHtml(n.question)}" onclick="event.stopPropagation(); openReadModal(${n.id})">${escapeHtml(n.question)}</li>`;
          });
          if (folderNotes.length > 8) {
            html += `<li class="channel-note-item empty">+${folderNotes.length - 8} lainnya</li>`;
          }
        }
        html += `<li class="channel-note-item add" onclick="event.stopPropagation(); openModal()">+ Catatan baru</li>`;
        html += `</ul>`;
      }
    });
    html += `<li class="channel-add" onclick="addCustomFolder()"><span class="channel-hash">+</span><span class="channel-name">Add folder</span></li>`;
    list.innerHTML = html;
  }

  function addCustomFolder() {
    openInputModal('Tambah Folder Baru', 'Nama folder / kategori...', (val) => {
      if (!folders.includes(val)) folders.push(val);
      activeFolder = val;
      activeSubbab = 'All';
      const foldersPerPage = getFoldersPerPage();
      folderCurrentPage = Math.floor((folders.length - 1) / foldersPerPage);
      save();
    });
  }

  function deleteFolder(event, folderName) {
    event.stopPropagation();
    if (folderName === 'All Notes') return;
    const notesInFolder = notes.filter(n => n.folder === folderName).length;
    let confirmMsg = `Yakin ingin menghapus folder "${folderName}"?`;
    if (notesInFolder > 0) confirmMsg += `\n\nAda ${notesInFolder} catatan di folder ini. Catatan akan dipindahkan ke folder 'General'.`;
    if (confirm(confirmMsg)) {
      folders = folders.filter(f => f !== folderName);
      delete folderSubbabs[folderName];
      notes.forEach(n => { if (n.folder === folderName) { n.folder = 'General'; n.subbab = ''; } });
      if (notes.some(n => n.folder === 'General') && !folders.includes('General')) folders.push('General');
      if (activeFolder === folderName) { activeFolder = 'All Notes'; activeSubbab = 'All'; }
      save();
    }
  }

  /* ---------- SUB BAB ---------- */
  function renderSubbabSection() {
    const container = document.getElementById('subbabSectionContainer');
    if (activeFolder === 'All Notes') { container.style.display = 'none'; container.innerHTML = ''; return; }
    container.style.display = 'block';

    const subList = folderSubbabs[activeFolder] || [];
    const allCount = notes.filter(n => n.folder === activeFolder).length;

    let pillsHTML = `<div class="subbab-pill ${activeSubbab === 'All' ? 'active' : ''}" onclick="selectSubbab('All')"><span>Semua</span><span class="pill-count">${allCount}</span></div>`;
    subList.forEach(s => {
      const count = notes.filter(n => n.folder === activeFolder && (n.subbab || '') === s).length;
      pillsHTML += `
        <div class="subbab-pill ${activeSubbab === s ? 'active' : ''}" onclick="selectSubbab('${jsEscape(s)}')">
          <span>${escapeHtml(s)}</span>
          <span class="pill-count">${count}</span>
          <button class="pill-icon-btn" title="Unduh PDF sub bab ini" onclick="event.stopPropagation(); exportPDF('${jsEscape(activeFolder)}','${jsEscape(s)}')">⬇</button>
          <button class="pill-icon-btn danger" title="Hapus sub bab" onclick="event.stopPropagation(); deleteSubbab('${jsEscape(activeFolder)}','${jsEscape(s)}')">✖</button>
        </div>
      `;
    });
    pillsHTML += `<div class="subbab-pill add-pill" onclick="addSubbabPrompt()">+ Sub Bab</div>`;

    container.innerHTML = `
      <div class="subbab-header">
        <h3>Sub Bab dalam "${escapeHtml(activeFolder)}"</h3>
        <button class="btn-folder-download" onclick="exportPDF('${jsEscape(activeFolder)}','All')">⬇ Unduh PDF Folder Ini</button>
      </div>
      <div class="subbab-pills">${pillsHTML}</div>
    `;
  }

  function addSubbabPrompt() {
    openInputModal('Tambah Sub Bab Baru', `Nama sub bab untuk folder "${activeFolder}"...`, (val) => {
      if (!folderSubbabs[activeFolder]) folderSubbabs[activeFolder] = [];
      if (!folderSubbabs[activeFolder].includes(val)) folderSubbabs[activeFolder].push(val);
      activeSubbab = val;
      save();
    });
  }

  function selectSubbab(name) { activeSubbab = name; renderSubbabSection(); renderNotes(); }

  function deleteSubbab(folderName, subName) {
    if (!confirm(`Hapus sub bab "${subName}"? Catatan di dalamnya akan dipindahkan ke "Tanpa Sub Bab".`)) return;
    folderSubbabs[folderName] = (folderSubbabs[folderName] || []).filter(s => s !== subName);
    notes.forEach(n => { if (n.folder === folderName && n.subbab === subName) n.subbab = ''; });
    if (activeSubbab === subName) activeSubbab = 'All';
    save();
  }

  /* ---------- MODAL: Buat / Edit Catatan ---------- */
  function refreshSubbabOptions(folderName, preselect) {
    const subbabSelect = document.getElementById('subbabSelect');
    const list = folderSubbabs[folderName] || [];
    let html = `<option value="">Tanpa Sub Bab</option>`;
    list.forEach(s => { html += `<option value="${escapeHtml(s)}" ${s === preselect ? 'selected' : ''}>${escapeHtml(s)}</option>`; });
    html += `<option value="__new__">+ Tambah Sub Bab Baru...</option>`;
    subbabSelect.innerHTML = html;
  }

  function onModalFolderChange() { refreshSubbabOptions(document.getElementById('folderSelect').value, ''); }

  function onModalSubbabChange() {
    const subbabSelect = document.getElementById('subbabSelect');
    if (subbabSelect.value === '__new__') {
      const folderName = document.getElementById('folderSelect').value;
      openInputModal('Tambah Sub Bab Baru', `Nama sub bab untuk folder "${folderName}"...`, (val) => {
        if (!folderSubbabs[folderName]) folderSubbabs[folderName] = [];
        if (!folderSubbabs[folderName].includes(val)) folderSubbabs[folderName].push(val);
        persist();
        refreshSubbabOptions(folderName, val);
      });
      subbabSelect.value = '';
    }
  }

  function openModal() {
    editingId = null;
    document.getElementById('modalTitleLabel').innerText = 'Catatan Baru';
    document.getElementById('qInput').value = '';
    document.getElementById('editor').innerHTML = '';

    const select = document.getElementById('folderSelect');
    let defaultFolder;
    if (activeFolder !== 'All Notes') { select.value = activeFolder; defaultFolder = activeFolder; }
    else if (select.options.length > 0) { select.selectedIndex = 0; defaultFolder = select.value; }

    const defaultSubbab = (activeFolder !== 'All Notes' && activeSubbab !== 'All') ? activeSubbab : '';
    refreshSubbabOptions(defaultFolder, defaultSubbab);

    document.getElementById('modalOverlay').classList.add('active');
    if (!isMobile()) document.getElementById('qInput').focus();
  }

  function editNote(id) {
    const n = notes.find(item => item.id === id);
    if (!n) return;
    closeReadModal();
    editingId = id;
    document.getElementById('modalTitleLabel').innerText = 'Edit Catatan';
    document.getElementById('qInput').value = n.question;
    document.getElementById('editor').innerHTML = n.answer;
    document.getElementById('folderSelect').value = n.folder;
    refreshSubbabOptions(n.folder, n.subbab || '');
    document.getElementById('modalOverlay').classList.add('active');
  }

  function closeModal() { document.getElementById('modalOverlay').classList.remove('active'); editingId = null; }
  function execCmd(cmd) { document.execCommand(cmd, false, null); document.getElementById('editor').focus(); }

  function saveNote() {
    const q = document.getElementById('qInput').value.trim();
    const content = document.getElementById('editor').innerHTML.trim();
    let f = document.getElementById('folderSelect').value;
    if (!f) f = 'General';
    let sb = document.getElementById('subbabSelect').value;
    if (sb === '__new__') sb = '';
    if (!q) { alert('Pertanyaan / judul tidak boleh kosong!'); return; }

    if (editingId) {
      const n = notes.find(item => item.id === editingId);
      if (n) { n.question = q; n.answer = content; n.folder = f; n.subbab = sb; }
    } else {
      notes.unshift({ id: Date.now(), question: q, answer: content, folder: f, subbab: sb, date: new Date().toLocaleDateString('en-GB') });
    }
    closeModal();
    save();
  }

  /* ---------- MODAL: baca catatan ---------- */
  function openReadModal(id) {
    const n = notes.find(item => item.id === id);
    if (!n) return;
    readingId = id;
    const theme = themeFor(n.folder);
    const icon = iconFor(n.folder);

    const content = document.getElementById('readPageContent');
    content.innerHTML = `
      <div class="read-close-row"><span class="close-x" onclick="closeReadModal()">&times;</span></div>
      <div class="read-header" style="background:${theme.bg};color:${theme.text}">
        <div class="read-icon" style="border-color:${theme.text}">${icon}</div>
        <div>
          <div class="read-folder-name">${escapeHtml(n.folder)}${n.subbab ? ' • ' + escapeHtml(n.subbab) : ''}</div>
          <div class="read-date">${escapeHtml(n.date)}</div>
        </div>
      </div>
      <div class="read-body">
        <div class="read-q">${escapeHtml(n.question)}</div>
        <div class="read-answer">${n.answer || ''}</div>
        <div class="read-meta">ID: ${n.id.toString().slice(-4)}</div>
      </div>
    `;

    document.getElementById('readEditBtn').onclick = () => editNote(id);
    document.getElementById('readDeleteBtn').onclick = () => { closeReadModal(); deleteNote(id); };
    document.getElementById('readDownloadBtn').onclick = () => exportSingleNotePDF(id);
    document.getElementById('readOverlay').classList.add('active');
  }

  function closeReadModal() { document.getElementById('readOverlay').classList.remove('active'); readingId = null; }

  /* ---------- MODAL INPUT GENERIK ---------- */
  function openInputModal(title, placeholder, callback) {
    document.getElementById('inputModalTitleLabel').innerText = title;
    const field = document.getElementById('inputModalField');
    field.placeholder = placeholder;
    field.value = '';
    inputModalCallback = callback;
    document.getElementById('inputModalOverlay').classList.add('active');
    if (!isMobile()) setTimeout(() => field.focus(), 50);
  }
  function closeInputModal() { document.getElementById('inputModalOverlay').classList.remove('active'); inputModalCallback = null; }
  function confirmInputModal() {
    const field = document.getElementById('inputModalField');
    const val = field.value.trim();
    if (!val) { alert('Nama tidak boleh kosong!'); return; }
    const cb = inputModalCallback;
    closeInputModal();
    if (cb) cb(val);
  }

  /* ---------- NOTES LIST ---------- */
  function renderNotes() {
    const grid = document.getElementById('notesGrid');
    const title = document.getElementById('notesTitle');
    const search = document.getElementById('searchInput').value.toLowerCase();

    let titleText = activeFolder === 'All Notes' ? 'Semua Catatan' : `Catatan: ${activeFolder}`;
    if (activeFolder !== 'All Notes' && activeSubbab !== 'All') titleText += ` — ${activeSubbab}`;
    title.innerText = titleText;
    grid.innerHTML = '';

    let list = activeFolder === 'All Notes' ? notes.slice() : notes.filter(n => n.folder === activeFolder);
    if (activeFolder !== 'All Notes' && activeSubbab !== 'All') list = list.filter(n => (n.subbab || '') === activeSubbab);
    if (search) list = list.filter(n => n.question.toLowerCase().includes(search) || stripHtml(n.answer).toLowerCase().includes(search));

    if (!dataLoaded) { grid.innerHTML = '<div class="empty-state">Memuat catatan...</div>'; return; }
    if (list.length === 0) { grid.innerHTML = '<div class="empty-state">Belum ada catatan di sini.<br>Ketuk "Buat Catatan Baru" untuk mulai menulis.</div>'; return; }

    list.forEach((n) => {
      const theme = themeFor(n.folder);
      const icon = iconFor(n.folder);
      const el = document.createElement('div');
      el.className = 'note-card';
      el.onclick = () => openReadModal(n.id);
      const previewText = stripHtml(n.answer || '');
      const metaLine = `${escapeHtml(n.folder)} • ${escapeHtml(n.date)}`;

      el.innerHTML = `
        <div class="card-desktop">
          <div class="note-card-topbar" style="background:${theme.bg};color:${theme.text}">
            <div class="note-card-icon" style="border-color:${theme.text}">${icon}</div>
            <div class="note-card-folder-name">${escapeHtml(n.folder)}${n.subbab ? ' • ' + escapeHtml(n.subbab) : ''}</div>
            <button class="note-menu-btn" onclick="openNoteMenu(event, ${n.id})">⋯</button>
          </div>
          <div class="note-card-body">
            <div class="note-title">${escapeHtml(n.question)}</div>
            <div class="note-preview ${previewText ? '' : 'is-empty'}">${escapeHtml(previewText)}</div>
            <div class="note-card-foot"><span>${escapeHtml(n.date)}</span><span>ID ${n.id.toString().slice(-4)}</span></div>
          </div>
        </div>
        <div class="card-mobile">
          <div class="mobile-icon" style="background:${theme.bg};color:${theme.text};border-color:${theme.text}">${icon}</div>
          <div class="mobile-text">
            <div class="mobile-title">${escapeHtml(n.question)}</div>
            <div class="mobile-meta">${metaLine}</div>
          </div>
          <button class="note-menu-btn" onclick="openNoteMenu(event, ${n.id})">⋯</button>
        </div>
      `;
      grid.appendChild(el);
    });
  }

  function deleteNote(id) { if (confirm('Hapus catatan ini?')) { notes = notes.filter(n => n.id !== id); save(); } }
  function render() { renderFolders(); renderSidebarFolders(); renderSubbabSection(); renderNotes(); }

  function escapeHtml(str) { return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
  function jsEscape(str) { return (str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'"); }
  function stripHtml(html) { const tmp = document.createElement('div'); tmp.innerHTML = html || ''; return tmp.textContent || tmp.innerText || ''; }

  /* ---------- EXPORT / IMPORT ---------- */
  function exportSingleNotePDF(id) {
    const n = notes.find(item => item.id === id);
    if (!n) return;
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const marginX = 20;
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const contentWidth = pageWidth - marginX * 2;
    let y = 22;

    doc.setFont('helvetica', 'bold'); doc.setFontSize(11); doc.setTextColor(33, 29, 23);
    doc.text('MINO NOTES', marginX, y);
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(120);
    doc.text(n.date, pageWidth - marginX, y, { align: 'right' });
    doc.setTextColor(0); y += 5;
    doc.setDrawColor(33, 29, 23); doc.setLineWidth(0.6); doc.line(marginX, y, pageWidth - marginX, y); y += 10;

    const breadcrumb = n.subbab ? `${n.folder}  /  ${n.subbab}` : n.folder;
    doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(130);
    doc.text(breadcrumb.toUpperCase(), marginX, y); doc.setTextColor(0); y += 9;

    doc.setFont('helvetica', 'bold'); doc.setFontSize(16);
    const qLines = doc.splitTextToSize(n.question, contentWidth);
    doc.text(qLines, marginX, y); y += qLines.length * 7.5 + 4;

    doc.setDrawColor(200); doc.setLineWidth(0.3); doc.line(marginX, y, pageWidth - marginX, y); y += 10;

    doc.setFont('helvetica', 'normal'); doc.setFontSize(11.5); doc.setTextColor(30);
    const answerText = stripHtml(n.answer) || '(Belum ada jawaban)';
    const aLines = doc.splitTextToSize(answerText, contentWidth);
    aLines.forEach(line => { if (y > pageHeight - 22) { doc.addPage(); y = 22; } doc.text(line, marginX, y); y += 6.2; });

    const pageCount = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
      doc.setPage(i);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(150);
      doc.text(`Mino Notes  •  ID ${n.id.toString().slice(-4)}  •  Halaman ${i} dari ${pageCount}`, pageWidth / 2, pageHeight - 10, { align: 'center' });
      doc.setTextColor(0);
    }

    const slug = n.question.toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_+|_+$/g, '').slice(0, 40) || 'catatan';
    doc.save(`${slug}_${n.id.toString().slice(-4)}.pdf`);
  }

  function exportPDF(folderName, subbabName) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    let list = (!folderName || folderName === 'All Notes') ? notes.slice() : notes.filter(n => n.folder === folderName);
    if (subbabName && subbabName !== 'All') list = list.filter(n => (n.subbab || '') === subbabName);
    if (list.length === 0) { alert('Tidak ada catatan untuk diekspor.'); return; }

    const marginX = 20;
    const pageWidth = doc.internal.pageSize.getWidth();
    const pageHeight = doc.internal.pageSize.getHeight();
    const contentWidth = pageWidth - marginX * 2;
    let y = 25;

    let mainTitle = (folderName && folderName !== 'All Notes') ? folderName : 'Semua Catatan';
    if (subbabName && subbabName !== 'All') mainTitle += ' — ' + subbabName;

    doc.setFont('times', 'bold'); doc.setFontSize(18); doc.text(mainTitle, marginX, y);
    y += 6; doc.setDrawColor(210); doc.line(marginX, y, pageWidth - marginX, y); y += 12;

    let grouped = {};
    if (!subbabName || subbabName === 'All') {
      list.forEach(n => { const key = n.subbab || 'Umum'; if (!grouped[key]) grouped[key] = []; grouped[key].push(n); });
    } else { grouped[subbabName] = list; }

    const groupKeys = Object.keys(grouped);
    groupKeys.forEach(subKey => {
      if (groupKeys.length > 1) {
        if (y + 14 > pageHeight - 20) { doc.addPage(); y = 25; }
        doc.setFont('times', 'bolditalic'); doc.setFontSize(13); doc.setTextColor(60);
        doc.text(subKey, marginX, y); doc.setTextColor(0); y += 8;
      }
      grouped[subKey].forEach((n, idx) => {
        doc.setFont('times', 'normal'); doc.setFontSize(11);
        const qLines = doc.splitTextToSize(`${idx + 1}. ${n.question}`, contentWidth);
        const aLines = doc.splitTextToSize(stripHtml(n.answer) || '(tidak ada isi)', contentWidth);
        const blockHeight = qLines.length * 6 + 6 + aLines.length * 5.5 + 10;
        if (y + blockHeight > pageHeight - 20) { doc.addPage(); y = 25; }
        doc.setFont('times', 'bold'); doc.setFontSize(12); doc.text(qLines, marginX, y); y += qLines.length * 6;
        doc.setFont('times', 'italic'); doc.setFontSize(9); doc.setTextColor(140);
        doc.text(n.date, marginX, y); doc.setTextColor(0); y += 6;
        doc.setFont('times', 'normal'); doc.setFontSize(11); doc.text(aLines, marginX, y); y += aLines.length * 5.5 + 8;
        doc.setDrawColor(232); doc.line(marginX, y - 4, pageWidth - marginX, y - 4);
      });
    });

    const pageCount = doc.internal.getNumberOfPages();
    for (let i = 1; i <= pageCount; i++) {
      doc.setPage(i);
      doc.setFont('times', 'italic'); doc.setFontSize(9); doc.setTextColor(150);
      doc.text(`Mino Notes • Halaman ${i} dari ${pageCount}`, pageWidth / 2, pageHeight - 10, { align: 'center' });
      doc.setTextColor(0);
    }

    const namePart = (subbabName && subbabName !== 'All') ? subbabName : (folderName || 'all');
    doc.save(`mino_notes_${namePart.replace(/\s+/g, '_')}_${Date.now()}.pdf`);
  }

  function exportJSON() {
    if (!notes.length) { alert('Data kosong.'); return; }
    const payload = { notes, folders, folderSubbabs };
    const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `mino_notes_backup_${Date.now()}.json`;
    a.click();
  }

  function importJSON(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try {
        const imported = JSON.parse(evt.target.result);
        if (Array.isArray(imported)) { notes = imported; }
        else if (imported && Array.isArray(imported.notes)) {
          notes = imported.notes;
          if (Array.isArray(imported.folders)) folders = imported.folders;
          if (imported.folderSubbabs && typeof imported.folderSubbabs === 'object') folderSubbabs = imported.folderSubbabs;
        } else { throw new Error('Format tidak dikenali'); }
        save();
        alert('Import berhasil!');
      } catch { alert('File JSON tidak valid.'); }
    };
    reader.readAsText(file);
    e.target.value = '';
  }
</script>
