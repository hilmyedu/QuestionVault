<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Simpul — Basis Pengetahuan Pribadi</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
<style>
  :root{
    --ink:#16202B;
    --ink-soft:#1E2B3A;
    --ink-line:#2C3B4C;
    --paper:#F5EFE1;
    --paper-dim:#ECE3CC;
    --surface:#FBF8EF;
    --line:#D9CDAE;
    --text:#2A2420;
    --text-dim:#786C58;
    --mustard:#B9862A;
    --mustard-soft:#E7D5A6;
    --teal:#3F7268;
    --teal-soft:#CFE0DA;
    --danger:#A6503F;
    --danger-soft:#EFD9D3;
    --font-serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --font-mono:ui-monospace,"SF Mono","Cascadia Mono","Liberation Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    font-family:var(--font-serif);
    color:var(--text);
    background:var(--paper);
    font-size:15px;
    line-height:1.55;
    transition:background-color .2s ease,color .2s ease;
  }
  button{font-family:var(--font-mono);cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  input,textarea,select{font-family:inherit;color:inherit;}
  ::selection{background:var(--mustard-soft);}

  /* ---------- Shell ---------- */
  .shell{display:flex;flex-direction:column;height:100vh;height:100dvh;}
  .topbar{
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:10px 16px;background:var(--ink);color:var(--paper);
    border-bottom:1px solid var(--ink-line);flex-shrink:0;
  }
  .brand{
    font-family:var(--font-mono);font-size:13px;letter-spacing:.03em;
    color:var(--mustard-soft);white-space:nowrap;
  }
  .brand b{color:var(--paper);font-weight:600;}
  .search-wrap{flex:1;max-width:460px;position:relative;}
  .search-wrap input{
    width:100%;padding:7px 10px 7px 30px;border-radius:3px;border:1px solid var(--ink-line);
    background:var(--ink-soft);color:var(--paper);font-size:13.5px;font-family:var(--font-mono);
  }
  .search-wrap input::placeholder{color:#7C8B9B;}
  .search-wrap input:focus{outline:1px solid var(--mustard);}
  .search-wrap .ico{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:#7C8B9B;font-size:13px;}
  .top-actions{display:flex;gap:8px;margin-left:auto;flex-shrink:0;}
  .btn{
    background:transparent;border:1px solid var(--ink-line);color:var(--paper);
    padding:6px 11px;border-radius:3px;font-size:12.5px;white-space:nowrap;
  }
  .btn:hover{border-color:var(--mustard);color:var(--mustard-soft);}
  .btn.primary{background:var(--mustard);border-color:var(--mustard);color:#221A0B;font-weight:600;}
  .btn.primary:hover{background:#CE9A3C;color:#221A0B;}
  .btn.icon-btn{padding:6px 10px;font-size:14px;line-height:1;}
  .btn:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,select:focus-visible{outline:2px solid var(--teal);outline-offset:1px;}

  .main{display:flex;flex:1;min-height:0;}

  /* ---------- Sidebar ---------- */
  .sidebar{
    width:250px;flex-shrink:0;background:var(--ink);color:var(--paper-dim);
    border-right:1px solid var(--ink-line);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 0 20px;
    transition:background-color .2s ease;
  }
  .side-section{padding:0 14px 16px;}
  .side-label{
    font-family:var(--font-mono);font-size:10.5px;color:#7C8B9B;
    margin:0 0 6px 2px;letter-spacing:.02em;
  }
  .side-item{
    display:flex;align-items:center;gap:6px;padding:7px 6px;border-radius:3px;
    font-size:13.5px;cursor:pointer;color:var(--paper-dim);white-space:nowrap;touch-action:manipulation;
  }
  .side-item:hover{background:var(--ink-soft);}
  .side-item.active{background:var(--ink-soft);color:var(--mustard-soft);}
  .side-item .count{margin-left:auto;font-family:var(--font-mono);font-size:11px;color:#6E7C8B;}
  .tree{font-family:var(--font-mono);font-size:12.8px;}
  .tree-node{white-space:nowrap;}
  .tree-row{display:flex;align-items:center;gap:3px;padding:5px 4px;border-radius:3px;}
  .tree-row:hover{background:var(--ink-soft);}
  .tree-row.active .tree-label{color:var(--mustard-soft);}
  .tree-branch{color:#57677A;flex-shrink:0;}
  .tree-chevron{
    background:none;border:none;color:#7C8B9B;font-size:9px;padding:6px 8px;margin:-4px -4px;
    display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;
    transform:rotate(0deg);transition:transform .15s ease;border-radius:2px;touch-action:manipulation;
  }
  .tree-chevron:hover{color:var(--mustard-soft);}
  .tree-chevron.open{transform:rotate(90deg);}
  .tree-label{cursor:pointer;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;padding:4px 0;touch-action:manipulation;}
  .tree-children{margin-left:2px;}
  .tree-add-row{cursor:pointer;touch-action:manipulation;}
  .tree-add-label{color:#5C6B7B;font-size:11.5px;}
  .tree-add-row:hover .tree-add-label{color:var(--mustard-soft);}
  .tree-del-btn{
    background:none;border:none;color:#57677A;font-size:12px;padding:5px 6px;margin-left:2px;
    border-radius:2px;flex-shrink:0;touch-action:manipulation;
  }
  .tree-del-btn:hover{color:var(--danger);}
  .tag-cloud{display:flex;flex-wrap:wrap;gap:6px;}
  .tag-pill{
    font-family:var(--font-mono);font-size:11px;padding:3px 8px;border-radius:10px;
    border:1px solid var(--ink-line);color:var(--paper-dim);cursor:pointer;touch-action:manipulation;
  }
  .tag-pill:hover,.tag-pill.active{border-color:var(--mustard);color:var(--mustard-soft);}
  .side-add{
    font-family:var(--font-mono);font-size:11.5px;color:#7C8B9B;background:none;border:none;
    padding:6px 6px;text-align:left;width:100%;cursor:pointer;touch-action:manipulation;
  }
  .side-add:hover{color:var(--mustard-soft);}

  /* ---------- Content list ---------- */
  .content{flex:1;display:flex;min-width:0;}
  .list-pane{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-width:0;border-right:1px solid var(--line);}
  .list-header{
    padding:16px 22px 10px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;
  }
  .list-header h1{font-size:19px;margin:0;font-weight:600;}
  .list-header .sub{font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);}
  .note-row{
    display:flex;gap:14px;align-items:flex-start;padding:13px 22px;border-top:1px solid var(--line);
    cursor:pointer;touch-action:manipulation;
  }
  .note-row:hover{background:var(--paper-dim);}
  .note-row .star{font-size:14px;color:var(--line);flex-shrink:0;margin-top:2px;background:none;border:none;padding:4px;touch-action:manipulation;}
  .note-row .star.on{color:var(--mustard);}
  .note-main{flex:1;min-width:0;}
  .note-title-row{display:flex;align-items:center;gap:8px;}
  .note-title{font-weight:600;font-size:15px;}
  .note-path{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);margin-top:2px;}
  .note-snip{font-size:13px;color:var(--text-dim);margin-top:4px;
    display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden;}
  .note-tags{margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;}
  .tag-chip{font-family:var(--font-mono);font-size:10.5px;color:var(--teal);background:var(--teal-soft);
    padding:1px 6px;border-radius:8px;}
  .note-date{font-family:var(--font-mono);font-size:10.5px;color:var(--text-dim);flex-shrink:0;margin-top:3px;}
  .empty-state{padding:60px 30px;text-align:center;color:var(--text-dim);}
  .empty-state .glyph{font-size:28px;margin-bottom:10px;}

  /* ---------- Editor ---------- */
  .editor-pane{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-width:0;display:flex;flex-direction:column;animation:fadeIn .18s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}
  .editor-toolbar{
    display:flex;align-items:center;gap:6px;padding:9px 20px;border-bottom:1px solid var(--line);
    flex-shrink:0;flex-wrap:wrap;
  }
  .tb-btn{
    background:none;border:1px solid var(--line);border-radius:3px;padding:4px 9px;font-size:12.5px;
    color:var(--text);touch-action:manipulation;
  }
  .tb-btn:hover{border-color:var(--teal);color:var(--teal);}
  .tb-sep{width:1px;height:18px;background:var(--line);margin:0 4px;}
  .tb-spacer{flex:1;}
  .tb-mode{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;}
  .tb-mode button{border:none;background:none;padding:4px 10px;font-size:11.5px;color:var(--text-dim);touch-action:manipulation;}
  .tb-mode button.active{background:var(--ink);color:var(--paper);}
  .mobile-only{display:none;}
  .editor-meta{padding:16px 20px 0;}
  .title-input{
    width:100%;font-family:var(--font-serif);font-size:26px;font-weight:600;border:none;background:none;
    padding:2px 0;color:var(--text);
  }
  .title-input:focus{outline:none;}
  .meta-row{display:flex;gap:14px;align-items:center;margin-top:8px;flex-wrap:wrap;}
  .meta-field{display:flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);}
  .meta-field select,.meta-field input{
    font-family:var(--font-mono);font-size:11.5px;border:1px solid var(--line);border-radius:3px;
    padding:3px 6px;background:var(--surface);color:var(--text);
  }
  .tags-input{min-width:200px;}
  .meta-toggle{
    border:1px solid var(--line);border-radius:3px;padding:3px 8px;background:var(--surface);
    font-family:var(--font-mono);font-size:11.5px;color:var(--text-dim);touch-action:manipulation;
  }
  .meta-toggle.on{border-color:var(--mustard);color:var(--mustard);background:var(--mustard-soft);}
  .meta-toggle.danger.on{border-color:var(--danger);color:var(--danger);background:var(--danger-soft);}
  .editor-body{flex:1;display:flex;min-height:0;padding:14px 20px 20px;gap:16px;}
  .editor-body.preview-only .src{display:none;}
  .editor-body.edit-only .prev{display:none;}
  .src,.prev{flex:1;min-width:0;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  textarea.src-area{
    width:100%;height:100%;resize:none;border:1px solid var(--line);border-radius:3px;
    padding:14px 16px;font-family:var(--font-mono);font-size:13px;line-height:1.6;background:var(--surface);color:var(--text);
  }
  textarea.src-area:focus{outline:none;border-color:var(--teal);}
  .prev{border:1px solid var(--line);border-radius:3px;padding:14px 20px;background:var(--surface);}
  .prev h1,.prev h2,.prev h3{font-family:var(--font-serif);}
  .prev pre{background:var(--ink);color:var(--paper-dim);padding:10px 12px;border-radius:3px;overflow-x:auto;font-size:12.5px;}
  .prev code{font-family:var(--font-mono);background:var(--paper-dim);padding:1px 4px;border-radius:2px;font-size:12.5px;}
  .prev pre code{background:none;padding:0;}
  .prev a{color:var(--teal);}
  .prev ul.contains-task-list{list-style:none;padding-left:4px;}

  /* ---------- Context panel ---------- */
  .context-panel{width:270px;flex-shrink:0;border-left:1px solid var(--line);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:18px 16px;background:var(--paper-dim);}
  .ctx-title{font-family:var(--font-mono);font-size:11px;color:var(--text-dim);margin:0 0 10px;}
  .ctx-block{margin-bottom:22px;}
  .link-row{display:flex;align-items:center;gap:6px;padding:6px 2px;font-size:13px;border-bottom:1px solid var(--line);cursor:pointer;touch-action:manipulation;}
  .link-row:hover{color:var(--teal);}
  .link-row .arrow{font-family:var(--font-mono);color:var(--text-dim);flex-shrink:0;}
  .ctx-empty{font-size:12.5px;color:var(--text-dim);font-style:italic;}

  /* ---------- AI tidy-up panel ---------- */
  .ai-tidy-block{border-top:1px solid var(--line);padding-top:18px;margin-bottom:8px;}
  .ai-tidy-desc{font-size:12px;color:var(--text-dim);margin:-4px 0 10px;line-height:1.5;}
  .ai-tidy-input{
    width:100%;min-height:110px;resize:vertical;border:1px solid var(--line);border-radius:4px;
    padding:9px 10px;font-family:var(--font-mono);font-size:12.5px;line-height:1.5;
    background:var(--surface);color:var(--text);
  }
  .ai-tidy-input:focus{outline:none;border-color:var(--teal);}
  .ai-tidy-btn{width:100%;margin-top:8px;padding:8px 0;color:#221A0B;}
  .ai-tidy-btn:disabled{opacity:.6;cursor:default;}
  .ai-tidy-output-wrap{margin-top:12px;}
  .ai-tidy-output{
    border:1px solid var(--line);border-radius:4px;background:var(--surface);
    padding:10px 11px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word;
    max-height:260px;overflow-y:auto;-webkit-overflow-scrolling:touch;
  }
  .ai-tidy-copy{width:100%;margin-top:8px;}

  /* ---------- Graph view ---------- */
  .graph-wrap{flex:1;position:relative;overflow:hidden;background:
      radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0/22px 22px, var(--paper);}
  .graph-wrap svg{width:100%;height:100%;touch-action:none;}
  .g-node circle{fill:var(--surface);stroke:var(--teal);stroke-width:1.6px;cursor:pointer;}
  .g-node.fav circle{stroke:var(--mustard);}
  .g-node text{font-family:var(--font-mono);font-size:10.5px;fill:var(--text);pointer-events:none;}
  .g-edge{stroke:var(--line);stroke-width:1.2px;}
  .graph-hint{position:absolute;bottom:14px;left:16px;font-family:var(--font-mono);font-size:11px;color:var(--text-dim);}

  /* ---------- Bottom nav (mobile) ---------- */
  .bottom-nav{display:none;flex-shrink:0;background:var(--ink);border-top:1px solid var(--ink-line);
    padding-bottom:env(safe-area-inset-bottom);}
  .bn-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    background:none;border:none;color:#8A98A8;padding:7px 0 6px;font-family:var(--font-mono);touch-action:manipulation;}
  .bn-btn .bn-ico{font-size:18px;line-height:1;}
  .bn-btn .bn-label{font-size:9.5px;letter-spacing:.02em;}
  .bn-btn.active{color:var(--mustard-soft);}
  .bn-btn.bn-main{margin-top:-16px;}
  .bn-btn.bn-main .bn-ico{
    width:44px;height:44px;border-radius:50%;background:var(--mustard);color:#221A0B;
    display:flex;align-items:center;justify-content:center;font-size:19px;box-shadow:0 3px 10px rgba(0,0,0,.35);
  }

  /* ---------- Drawer backdrop (mobile sidebar) ---------- */
  .drawer-backdrop{position:fixed;inset:0;background:rgba(8,10,13,.5);z-index:65;opacity:0;
    transition:opacity .2s ease;touch-action:manipulation;}
  .drawer-backdrop.show{opacity:1;}

  /* ---------- Modal / action sheet ---------- */
  .modal-backdrop{
    position:fixed;inset:0;background:rgba(10,14,18,.55);z-index:200;
    display:flex;align-items:center;justify-content:center;padding:16px;
    opacity:0;transition:opacity .18s ease;
  }
  .modal-backdrop.show{opacity:1;}
  .modal-backdrop[hidden]{display:none;}
  .modal-box{
    background:var(--paper);color:var(--text);width:min(420px,100%);padding:22px;border-radius:8px;
    box-shadow:0 14px 44px rgba(0,0,0,.3);border:1px solid var(--line);
    transform:translateY(6px) scale(.98);transition:transform .18s ease;
  }
  .modal-backdrop.show .modal-box{transform:translateY(0) scale(1);}
  .modal-title{font-family:var(--font-serif);font-size:18px;font-weight:600;margin-bottom:8px;}
  .modal-message{font-size:13.5px;color:var(--text-dim);line-height:1.5;margin-bottom:14px;}
  .modal-input{
    width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:4px;font-family:var(--font-mono);
    font-size:13.5px;background:var(--surface);color:var(--text);margin-bottom:4px;
  }
  .modal-input:focus{outline:none;border-color:var(--teal);}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}
  .modal-btn{
    background:transparent;border:1px solid var(--line);color:var(--text);padding:8px 15px;
    border-radius:4px;font-family:var(--font-mono);font-size:12.5px;touch-action:manipulation;
  }
  .modal-btn:hover{border-color:var(--teal);color:var(--teal);}
  .modal-btn.primary{background:var(--mustard);border-color:var(--mustard);color:#221A0B;font-weight:600;}
  .modal-btn.primary:hover{background:#CE9A3C;color:#221A0B;}
  .modal-btn.danger{background:var(--danger);border-color:var(--danger);color:#fff;font-weight:600;}
  .modal-btn.danger:hover{background:#B85F4C;color:#fff;}
  .sheet-list{margin-top:4px;}
  .sheet-item{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 4px;
    border:none;border-bottom:1px solid var(--line);background:none;font-family:var(--font-serif);
    font-size:14.5px;color:var(--text);touch-action:manipulation;
  }
  .sheet-item:last-child{border-bottom:none;}
  .sheet-item:hover{color:var(--teal);}
  .sheet-item.danger{color:var(--danger);}

  /* ---------- Toasts ---------- */
  .toast-root{position:fixed;bottom:16px;left:0;right:0;display:flex;flex-direction:column;
    align-items:center;gap:8px;z-index:300;pointer-events:none;}
  .toast{
    background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:20px;font-size:13px;
    font-family:var(--font-mono);box-shadow:0 6px 20px rgba(0,0,0,.3);opacity:0;transform:translateY(8px);
    transition:opacity .2s ease,transform .2s ease;max-width:88vw;text-align:center;
  }
  .toast.show{opacity:1;transform:none;}
  .toast.danger{background:var(--danger);color:#fff;}

  /* scrollbars */
  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;}
  .sidebar::-webkit-scrollbar-thumb{background:var(--ink-line);}

  /* ---------- Responsive / mobile ---------- */
  @media (max-width:860px){
    .bottom-nav{display:flex;}
    .context-panel{display:none;}
    .mobile-only{display:inline-flex;}
    .top-actions .btn:not(.icon-btn){display:none;}
    .search-wrap{order:3;flex:1 1 100%;max-width:none;margin-top:4px;}
    .sidebar{
      position:fixed;top:0;bottom:0;left:0;width:82%;max-width:310px;z-index:70;
      transform:translateX(-100%);transition:transform .22s ease;box-shadow:3px 0 24px rgba(0,0,0,.35);
    }
    .sidebar.open{transform:translateX(0);}
    .list-header{padding:14px 16px 8px;}
    .note-row{padding:12px 16px;}
    .editor-meta{padding:14px 16px 0;}
    .title-input{font-size:21px;}
    .editor-toolbar{padding:8px 12px;}
    .editor-body{padding:12px 12px 16px;flex-direction:column;}
    .modal-backdrop{align-items:flex-end;padding:0;}
    .modal-box{width:100%;border-radius:14px 14px 0 0;transform:translateY(100%);}
    .modal-backdrop.show .modal-box{transform:translateY(0);}
    .modal-actions{flex-direction:column-reverse;}
    .modal-actions .modal-btn{width:100%;padding:11px;}
  }
  @media (min-width:861px){
    .drawer-backdrop{display:none;}
  }
</style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <div class="brand"><b>Simpul</b> · basis pengetahuan pribadi <span id="storageStatus" style="font-size:10px;color:#8FA69A;margin-left:6px">● tersimpan lokal</span></div>
    <div class="search-wrap">
      <span class="ico">⌕</span>
      <input id="searchInput" type="text" placeholder="cari judul, isi, atau tag…">
    </div>
    <div class="top-actions">
      <button class="btn" id="btnGraph">Peta Pengetahuan</button>
      <button class="btn" id="btnExport">Ekspor JSON</button>
      <button class="btn" id="btnImport">Impor JSON</button>
      <input type="file" id="fileImport" accept=".json" style="display:none">
      <button class="btn primary" id="btnNew">+ Catatan Baru</button>
    </div>
  </div>

  <div class="main">
    <div class="sidebar" id="sidebar"></div>
    <div class="content" id="content"></div>
  </div>

  <nav class="bottom-nav" id="bottomNav">
    <button class="bn-btn" data-bn="all"><span class="bn-ico">🗂</span><span class="bn-label">Catatan</span></button>
    <button class="bn-btn" data-bn="folders"><span class="bn-ico">📁</span><span class="bn-label">Folder</span></button>
    <button class="bn-btn bn-main" data-bn="new"><span class="bn-ico">✎</span></button>
    <button class="bn-btn" data-bn="graph"><span class="bn-ico">◈</span><span class="bn-label">Peta</span></button>
    <button class="bn-btn" data-bn="more"><span class="bn-ico">⋯</span><span class="bn-label">Lainnya</span></button>
  </nav>

</div>

<script>
(function(){
"use strict";

/* ============ DATA LAYER ============ */
const STORAGE_KEY = "simpul_kb_v1";

// Persistent local storage.
// The previous version used an in-memory object when window.storage was unavailable,
// so every browser reload recreated the default sample data. We now use localStorage
// as the browser fallback, which survives reloads and browser restarts.
const storageApi = (window.storage && typeof window.storage.get === "function")
  ? window.storage
  : {
      async get(key){
        // When opened through server.py, data is stored in the real data.json file.
        // When opened directly as file://, fall back to browser localStorage.
        if(location.protocol === "http:" || location.protocol === "https:"){
          try{
            const res = await fetch("/api/data", {cache:"no-store"});
            if(res.ok){
              const value = await res.text();
              if(value) return {key,value};
            }
          }catch(e){}
        }
        const value = localStorage.getItem(key);
        return value !== null ? {key,value} : null;
      },
      async set(key,value){
        if(location.protocol === "http:" || location.protocol === "https:"){
          try{
            const res = await fetch("/api/data", {
              method:"POST",
              headers:{"Content-Type":"application/json"},
              body:value
            });
            if(res.ok) return {key,value};
          }catch(e){}
        }
        localStorage.setItem(key,value);
        return {key,value};
      },
    };

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function now(){ return new Date().toISOString(); }
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
}

function defaultData(){
  const mk = (name, icon, children) => ({id:uid(), name, icon:icon||null, children:children||[]});
  const folders = [
    mk("Programming","📚",[mk("Flutter"),mk("Dart"),mk("Firebase"),mk("Linux"),mk("Git")]),
    mk("Learning","🎓",[mk("Algorithms"),mk("UI/UX"),mk("Database")]),
    mk("Ideas","💡",[mk("App Ideas"),mk("Website Ideas"),mk("Business Ideas")]),
    mk("Cheatsheets","🔧",[mk("Linux"),mk("Git"),mk("Flutter")]),
    mk("Bookmarks","🔖",[mk("Articles"),mk("Documentation")]),
  ];
  const flutterFolder = folders[0].children[0].id;
  const t = now();
  const notes = [
    {
      id:uid(), title:"Responsive Layout Flutter", folderId:flutterFolder,
      tags:["flutter","responsive","mobile"], favorite:true, archived:false,
      createdAt:t, updatedAt:t,
      content:
`## Ringkasan

Cara membuat layout Flutter yang menyesuaikan ukuran layar (HP, tablet, desktop) menggunakan \`LayoutBuilder\` dan \`MediaQuery\`.

## Contoh

\`\`\`dart

      return MobileView();

\`\`\`

## Checklist implementasi

- [x] Pakai LayoutBuilder di root halaman
- [x] Tentukan breakpoint (600px, 900px)
- [ ] Uji di tablet
- [ ] Uji di desktop lebar

## Catatan terkait

Lihat juga [[Flutter MediaQuery]] dan [[Adaptive Layout Breakpoints]].`
    },
    {
      id:uid(), title:"Flutter MediaQuery", folderId:flutterFolder,
      tags:["flutter","responsive"], favorite:false, archived:false,
      createdAt:t, updatedAt:t,
      content:
`\`MediaQuery.of(context).size\` memberi tahu ukuran layar saat ini. Dipakai bersama [[Responsive Layout Flutter]] untuk menentukan breakpoint di [[Adaptive Layout Breakpoints]].`
    },
    {
      id:uid(), title:"Adaptive Layout Breakpoints", folderId:flutterFolder,
      tags:["flutter","ui"], favorite:false, archived:false,
      createdAt:t, updatedAt:t,
      content:
`Konvensi breakpoint yang umum dipakai:

- **Mobile**: < 600px
- **Tablet**: 600–900px
- **Desktop**: > 900px

Dipakai di [[Responsive Layout Flutter]].`
    }
  ];
  return {folders, notes, ui:{lastFolder:null,lastTag:null,view:"all"}};
}

let DB = null;

async function load(){
  try{
    const result = await storageApi.get(STORAGE_KEY, false);
    if(result && result.value){
      const parsed = JSON.parse(result.value);
      if(parsed && Array.isArray(parsed.notes) && Array.isArray(parsed.folders)) return parsed;
    }
  }catch(e){
    console.warn("Gagal memuat data tersimpan, memulai baru.", e);
  }
  const d = defaultData();
  await persist(d);
  return d;
}
async function persist(d){
  try{ await storageApi.set(STORAGE_KEY, JSON.stringify(d||DB), false); }
  catch(e){ console.error("Gagal menyimpan data", e); }
}
let saveQueue = Promise.resolve();
function saveNow(){
  // Queue writes so rapid editor changes cannot race each other.
  saveQueue = saveQueue.then(()=>persist(DB)).catch(err=>console.error("Gagal menyimpan data",err));
  return saveQueue;
}

/* ---------- folder helpers ---------- */
function allFolders(){
  const out = [];
  (function walk(list, path){
    list.forEach(f=>{
      out.push({folder:f, path:[...path,f.name]});
      if(f.children && f.children.length) walk(f.children, [...path,f.name]);
    });
  })(DB.folders, []);
  return out;
}
function findFolder(id){ return allFolders().find(x=>x.folder.id===id); }
function folderPathStr(id){
  const f = findFolder(id);
  return f ? f.path.join(" / ") : "Tanpa folder";
}
function addSubfolder(parentId, name){
  if(!name) return;
  const node = {id:uid(), name, icon:null, children:[]};
  if(!parentId){ DB.folders.push(node); }
  else{
    const target = findFolder(parentId);
    if(target) target.folder.children.push(node);
    state.expandedFolders.add(parentId);
  }
  saveNow(); renderSidebar();
  showToast("Folder \""+name+"\" ditambahkan");
}
function collectFolderIds(folder){
  let ids = [folder.id];
  (folder.children||[]).forEach(c=> ids = ids.concat(collectFolderIds(c)));
  return ids;
}
function removeFolderFromTree(list, id){
  return list.filter(f=>{
    if(f.id===id) return false;
    if(f.children && f.children.length) f.children = removeFolderFromTree(f.children, id);
    return true;
  });
}
async function deleteFolder(id){
  const info = findFolder(id);
  if(!info) return;
  const hasChildren = info.folder.children && info.folder.children.length>0;
  const ok = await showConfirm({
    title:`Hapus folder "${info.folder.name}"?`,
    message: hasChildren
      ? "Subfolder di dalamnya akan ikut terhapus. Catatan yang ada di folder ini dan subfoldernya TIDAK dihapus — hanya dipindah ke \"tanpa folder\"."
      : "Catatan di dalam folder ini TIDAK dihapus — hanya dipindah ke \"tanpa folder\".",
    confirmText:"Hapus folder", cancelText:"Batal", danger:true
  });
  if(!ok) return;
  const idsToClear = collectFolderIds(info.folder);
  DB.notes.forEach(n=>{ if(idsToClear.includes(n.folderId)) n.folderId = null; });
  DB.folders = removeFolderFromTree(DB.folders, id);
  idsToClear.forEach(fid=> state.expandedFolders.delete(fid));
  if(state.filterFolder && idsToClear.includes(state.filterFolder)){
    state.filterFolder = null; state.route = "list"; state.activeNoteId = null;
  }
  await saveNow();
  render();
  showToast("Folder dihapus, catatan dipindah ke \"tanpa folder\"");
}

/* ---------- note helpers ---------- */
function allTags(){
  const s = new Set();
  DB.notes.forEach(n=> n.tags.forEach(t=>s.add(t)));
  return Array.from(s).sort();
}
function noteById(id){ return DB.notes.find(n=>n.id===id); }
function wikilinksIn(content){
  const out = [];
  const re = /\[\[([^\]]+)\]\]/g;
  let m;
  while((m = re.exec(content))) out.push(m[1].trim());
  return out;
}
function outgoingLinks(note){
  return wikilinksIn(note.content||"")
    .map(title => DB.notes.find(n=> n.title.toLowerCase() === title.toLowerCase()))
    .filter(Boolean);
}
function backlinksTo(note){
  return DB.notes.filter(n=>
    n.id !== note.id &&
    wikilinksIn(n.content||"").some(t => t.toLowerCase() === note.title.toLowerCase())
  );
}

/* ============ APP STATE ============ */
const state = {
  route: "list",          // "list" | "editor" | "graph"
  filterFolder: null,
  filterTag: null,
  filterSpecial: null,     // "favorite" | "archive" | null
  search: "",
  activeNoteId: null,
  editorMode: "split",     // "split" | "edit-only" | "preview-only"
  expandedFolders: new Set(),
};

/* ============ UTIL ============ */
function escHtml(s){
  return String(s??"").replace(/[&<>]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
}
function escAttr(s){
  return String(s??"").replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

/* ============ TOASTS ============ */
function showToast(message, opts){
  opts = opts||{};
  const root = document.getElementById("toastRoot");
  const el = document.createElement("div");
  el.className = "toast" + (opts.danger?" danger":"");
  el.textContent = message;
  root.appendChild(el);
  requestAnimationFrame(()=> el.classList.add("show"));
  setTimeout(()=>{
    el.classList.remove("show");
    setTimeout(()=> el.remove(), 220);
  }, opts.duration||2400);
}

/* ============ MODAL SYSTEM ============ */
function openModal(opts){
  return new Promise((resolve)=>{
    const backdrop = document.getElementById("modalBackdrop");
    const box = document.getElementById("modalBox");
    box.innerHTML = `
      <div class="modal-title">${escHtml(opts.title||"")}</div>
      ${opts.message?`<div class="modal-message">${escHtml(opts.message)}</div>`:""}
      ${opts.input?`<input class="modal-input" id="modalInputField" value="${escAttr(opts.inputValue||"")}" placeholder="${escAttr(opts.inputPlaceholder||"")}">`:""}
      <div class="modal-actions">
        ${opts.hideCancel?"":`<button class="modal-btn" id="modalCancel">${escHtml(opts.cancelText||"Batal")}</button>`}
        <button class="modal-btn ${opts.danger?'danger':'primary'}" id="modalConfirm">${escHtml(opts.confirmText||"OK")}</button>
      </div>`;
    backdrop.hidden = false;
    requestAnimationFrame(()=> backdrop.classList.add("show"));
    const field = document.getElementById("modalInputField");
    const confirmBtn = document.getElementById("modalConfirm");
    if(field){ field.focus(); field.select(); } else { confirmBtn.focus(); }

    function finish(result){
      backdrop.classList.remove("show");
      setTimeout(()=>{ backdrop.hidden = true; }, 180);
      document.removeEventListener("keydown", onKey);
      resolve(result);
    }
    function onKey(e){
      if(e.key==="Escape") finish(opts.input? null : false);
      else if(e.key==="Enter" && field) { e.preventDefault(); confirmBtn.click(); }
    }
    document.addEventListener("keydown", onKey);
    confirmBtn.addEventListener("click", ()=> finish(opts.input ? field.value : true));
    const cancelBtn = document.getElementById("modalCancel");
    if(cancelBtn) cancelBtn.addEventListener("click", ()=> finish(opts.input? null : false));
    backdrop.addEventListener("click", function bdClick(e){
      if(e.target===backdrop){ finish(opts.input?null:false); backdrop.removeEventListener("click", bdClick); }
    });
  });
}
function showConfirm(opts){ return openModal(Object.assign({}, opts, {input:false})); }
function showPromptModal(opts){ return openModal(Object.assign({}, opts, {input:true})); }
function showAlert(opts){ return openModal(Object.assign({}, opts, {input:false, hideCancel:true, confirmText: opts.confirmText||"Mengerti"})); }

function openActionSheet(title, actions){
  const backdrop = document.getElementById("modalBackdrop");
  const box = document.getElementById("modalBox");
  box.innerHTML = `<div class="modal-title">${escHtml(title)}</div>
    <div class="sheet-list">
      ${actions.map((a,i)=>`<button class="sheet-item ${a.danger?'danger':''}" data-act="${i}">${a.icon||''} ${escHtml(a.label)}</button>`).join("")}
    </div>
    <div class="modal-actions"><button class="modal-btn" id="modalCancel">Tutup</button></div>`;
  backdrop.hidden = false;
  requestAnimationFrame(()=> backdrop.classList.add("show"));
  function close(){
    backdrop.classList.remove("show");
    setTimeout(()=>{ backdrop.hidden = true; }, 180);
    document.removeEventListener("keydown", onKey);
  }
  function onKey(e){ if(e.key==="Escape") close(); }
  document.addEventListener("keydown", onKey);
  box.querySelectorAll("[data-act]").forEach(btn=> btn.addEventListener("click", ()=>{
    close(); actions[+btn.getAttribute("data-act")].onClick();
  }));
  document.getElementById("modalCancel").addEventListener("click", close);
  backdrop.addEventListener("click", function bdClick(e){
    if(e.target===backdrop){ close(); backdrop.removeEventListener("click", bdClick); }
  });
}
function showLinksSheet(note){
  const outs = outgoingLinks(note), backs = backlinksTo(note);
  const backdrop = document.getElementById("modalBackdrop");
  const box = document.getElementById("modalBox");
  box.innerHTML = `<div class="modal-title">Tautan catatan ini</div>
    <div class="ctx-title">TERTAUT KE (${outs.length})</div>
    ${outs.length?outs.map(o=>`<div class="link-row" data-goto="${o.id}"><span class="arrow">→</span>${escHtml(o.title)}</div>`).join(""):`<div class="ctx-empty">Tidak ada tautan keluar.</div>`}
    <div class="ctx-title" style="margin-top:16px">DISEBUT DARI (${backs.length})</div>
    ${backs.length?backs.map(o=>`<div class="link-row" data-goto="${o.id}"><span class="arrow">←</span>${escHtml(o.title)}</div>`).join(""):`<div class="ctx-empty">Belum ada catatan lain yang menyebut ini.</div>`}
    <div class="modal-actions"><button class="modal-btn" id="modalCancel">Tutup</button></div>`;
  backdrop.hidden = false;
  requestAnimationFrame(()=> backdrop.classList.add("show"));
  function close(){ backdrop.classList.remove("show"); setTimeout(()=>{ backdrop.hidden=true; },180); }
  box.querySelectorAll("[data-goto]").forEach(n=> n.addEventListener("click", ()=>{ close(); openNote(n.getAttribute("data-goto")); }));
  document.getElementById("modalCancel").addEventListener("click", close);
  backdrop.addEventListener("click", function bdClick(e){ if(e.target===backdrop){ close(); backdrop.removeEventListener("click", bdClick); } });
}

/* ============ THEME: TERANG PERMANEN ============ */
function initTheme(){
  // Simpul selalu menggunakan mode terang, apa pun tema Chrome/OS.
  document.documentElement.setAttribute("data-theme", "light");
}

/* ============ MOBILE DRAWER ============ */
function openDrawer(){
  document.getElementById("sidebar").classList.add("open");
  const bd = document.getElementById("drawerBackdrop");
  bd.hidden = false;
  requestAnimationFrame(()=> bd.classList.add("show"));
}
function closeDrawer(){
  document.getElementById("sidebar").classList.remove("open");
  const bd = document.getElementById("drawerBackdrop");
  bd.classList.remove("show");
  setTimeout(()=>{ bd.hidden = true; }, 200);
}
document.getElementById("drawerBackdrop").addEventListener("click", closeDrawer);

/* ============ RENDER: SIDEBAR ============ */
function renderSidebar(){
  const el = document.getElementById("sidebar");
  const counts = {
    all: DB.notes.filter(n=>!n.archived).length,
    fav: DB.notes.filter(n=>n.favorite && !n.archived).length,
    arch: DB.notes.filter(n=>n.archived).length,
  };

  let html = `<div class="side-section">
    <div class="side-item ${state.filterSpecial===null && !state.filterFolder && !state.filterTag ? 'active':''}" data-nav="all">
      <span>🗂 Semua catatan</span><span class="count">${counts.all}</span>
    </div>
    <div class="side-item ${state.filterSpecial==='favorite'?'active':''}" data-nav="favorite">
      <span>★ Favorit</span><span class="count">${counts.fav}</span>
    </div>
    <div class="side-item ${state.filterSpecial==='archive'?'active':''}" data-nav="archive">
      <span>▤ Arsip</span><span class="count">${counts.arch}</span>
    </div>
  </div>`;

  html += `<div class="side-section"><div class="side-label">FOLDER</div><div class="tree">`;
  html += renderFolderLevel(DB.folders, 0);
  html += `</div><button class="side-add" data-add-root="1">+ tambah folder utama</button></div>`;

  const tags = allTags();
  if(tags.length){
    html += `<div class="side-section"><div class="side-label">TAG</div><div class="tag-cloud">`;
    tags.forEach(t=>{
      html += `<span class="tag-pill ${state.filterTag===t?'active':''}" data-tag="${escAttr(t)}">#${escHtml(t)}</span>`;
    });
    html += `</div></div>`;
  }

  el.innerHTML = html;

  function navigateAndClose(fn){ fn(); closeDrawer(); }

  el.querySelectorAll("[data-nav]").forEach(n=> n.addEventListener("click", ()=> navigateAndClose(()=>{
    const v = n.getAttribute("data-nav");
    state.filterFolder=null; state.filterTag=null;
    state.filterSpecial = (v==="all") ? null : v;
    state.route="list"; state.activeNoteId=null;
    render();
  })));
  el.querySelectorAll("[data-folder]").forEach(n=> n.addEventListener("click", ()=> navigateAndClose(()=>{
    state.filterFolder = n.getAttribute("data-folder");
    state.filterTag=null; state.filterSpecial=null;
    state.route="list"; state.activeNoteId=null;
    render();
  })));
  el.querySelectorAll("[data-tag]").forEach(n=> n.addEventListener("click", ()=> navigateAndClose(()=>{
    state.filterTag = n.getAttribute("data-tag");
    state.filterFolder=null; state.filterSpecial=null;
    state.route="list"; state.activeNoteId=null;
    render();
  })));
  el.querySelectorAll("[data-toggle]").forEach(btn=> btn.addEventListener("click", (e)=>{
    e.stopPropagation();
    const id = btn.getAttribute("data-toggle");
    if(state.expandedFolders.has(id)) state.expandedFolders.delete(id);
    else state.expandedFolders.add(id);
    renderSidebar();
  }));
  const addRoot = el.querySelector("[data-add-root]");
  if(addRoot) addRoot.addEventListener("click", async ()=>{
    const name = await showPromptModal({title:"Folder utama baru", inputPlaceholder:"Nama folder", confirmText:"Tambah"});
    if(name && name.trim()) addSubfolder(null, name.trim());
  });
  el.querySelectorAll("[data-add-sub]").forEach(n=> n.addEventListener("click", async (e)=>{
    e.stopPropagation();
    const pid = n.getAttribute("data-add-sub");
    const name = await showPromptModal({title:"Subfolder baru", inputPlaceholder:"Nama subfolder", confirmText:"Tambah"});
    if(name && name.trim()) addSubfolder(pid, name.trim());
  }));
  el.querySelectorAll("[data-del-folder]").forEach(btn=> btn.addEventListener("click", async (e)=>{
    e.stopPropagation();
    await deleteFolder(btn.getAttribute("data-del-folder"));
  }));
}

function renderFolderLevel(list, depth){
  let out = "";
  list.forEach((f, idx)=>{
    const expanded = state.expandedFolders.has(f.id);
    const last = idx === list.length-1;
    const branch = depth===0 ? "" : (last ? "└── " : "├── ");
    const count = DB.notes.filter(n=>n.folderId===f.id && !n.archived).length;
    const hasChildren = f.children && f.children.length>0;
    out += `<div class="tree-node">
      <div class="tree-row ${state.filterFolder===f.id?'active':''}" style="padding-left:${depth*4}px">
        <span class="tree-branch">${branch}</span>
        <button class="tree-chevron ${expanded?'open':''}" data-toggle="${f.id}" aria-label="Buka atau tutup folder">▸</button>
        <span class="tree-label" data-folder="${f.id}">${f.icon?f.icon+' ':''}${escHtml(f.name)}</span>
        <span class="count">${count||''}</span>
        <button class="tree-del-btn" data-del-folder="${f.id}" aria-label="Hapus folder" title="Hapus folder">✕</button>
      </div>
      <div class="tree-children" style="display:${expanded?'block':'none'}">
        ${hasChildren ? renderFolderLevel(f.children, depth+1) : ""}
        <div class="tree-row tree-add-row" data-add-sub="${f.id}" style="padding-left:${(depth+1)*4}px">
          <span class="tree-branch">${hasChildren?'└── ':''}</span><span class="tree-add-label">+ subfolder</span>
        </div>
      </div>
    </div>`;
  });
  return out;
}

/* ============ RENDER: CONTENT ROUTER ============ */
function render(){
  renderSidebar();
  const el = document.getElementById("content");
  if(state.route === "graph"){
    el.innerHTML = `<div class="graph-wrap" id="graphWrap"></div>`;
    renderGraph();
  } else if(state.route === "editor" && state.activeNoteId){
    el.innerHTML = `<div class="editor-pane" id="editorPane"></div><div class="context-panel" id="ctxPanel"></div>`;
    renderEditor();
    renderContextPanel();
  } else {
    el.innerHTML = `<div class="list-pane" id="listPane"></div><div class="context-panel" id="ctxPanel"></div>`;
    renderList();
    renderContextPanel();
  }
  document.getElementById("btnGraph").classList.toggle("primary", state.route==="graph");
  updateBottomNavActive();
}

function updateBottomNavActive(){
  const isAll = state.route==="list" && !state.filterFolder && !state.filterTag && !state.filterSpecial;
  document.querySelectorAll("#bottomNav [data-bn]").forEach(b=>{
    const key = b.getAttribute("data-bn");
    b.classList.toggle("active", (key==="all"&&isAll) || (key==="graph"&&state.route==="graph"));
  });
}

/* ============ RENDER: LIST ============ */
function currentFilterLabel(){
  if(state.filterSpecial==="favorite") return "Favorit";
  if(state.filterSpecial==="archive") return "Arsip";
  if(state.filterFolder) return folderPathStr(state.filterFolder);
  if(state.filterTag) return "#"+state.filterTag;
  return "Semua catatan";
}

function matchesFilters(n){
  if(state.filterSpecial==="archive") return n.archived;
  if(n.archived) return false;
  if(state.filterSpecial==="favorite") return n.favorite;
  if(state.filterFolder) return n.folderId===state.filterFolder;
  if(state.filterTag) return n.tags.includes(state.filterTag);
  return true;
}
function matchesSearch(n){
  const q = state.search.trim().toLowerCase();
  if(!q) return true;
  const words = q.split(/\s+/);
  const hay = (n.title+" "+n.content+" "+n.tags.join(" ")).toLowerCase();
  return words.every(w=>hay.includes(w));
}

function renderList(){
  const el = document.getElementById("listPane");
  const notes = DB.notes.filter(matchesFilters).filter(matchesSearch)
    .sort((a,b)=> new Date(b.updatedAt)-new Date(a.updatedAt));

  let html = `<div class="list-header">
      <h1>${escHtml(currentFilterLabel())}</h1>
      <span class="sub">${notes.length} catatan</span>
    </div>`;

  if(notes.length===0){
    html += `<div class="empty-state">
      <div class="glyph">◌</div>
      <div>Belum ada catatan di sini.<br>Tulis yang pertama.</div>
    </div>`;
  } else {
    notes.forEach(n=>{
      const snip = (n.content||"").replace(/[#*`>-]/g," ").replace(/\[\[([^\]]+)\]\]/g,"$1").slice(0,140);
      html += `<div class="note-row" data-open="${n.id}">
        <button class="star ${n.favorite?'on':''}" data-star="${n.id}" aria-label="Favorit">${n.favorite?'★':'☆'}</button>
        <div class="note-main">
          <div class="note-title-row"><span class="note-title">${escHtml(n.title||"(tanpa judul)")}</span></div>
          <div class="note-path">${escHtml(folderPathStr(n.folderId))}</div>
          <div class="note-snip">${escHtml(snip)}</div>
          ${n.tags.length?`<div class="note-tags">${n.tags.map(t=>`<span class="tag-chip">#${escHtml(t)}</span>`).join("")}</div>`:""}
        </div>
        <div class="note-date">${fmtDate(n.updatedAt)}</div>
      </div>`;
    });
  }
  el.innerHTML = html;

  el.querySelectorAll("[data-open]").forEach(n=> n.addEventListener("click",(e)=>{
    if(e.target.closest("[data-star]")) return;
    openNote(n.getAttribute("data-open"));
  }));
  el.querySelectorAll("[data-star]").forEach(n=> n.addEventListener("click",(e)=>{
    e.stopPropagation();
    const note = noteById(n.getAttribute("data-star"));
    note.favorite = !note.favorite; note.updatedAt = now();
    saveNow(); renderList(); renderSidebar();
  }));
}

/* ============ RENDER: EDITOR ============ */
function openNote(id){
  state.activeNoteId = id;
  state.route = "editor";
  closeDrawer();
  render();
}
function createNote(){
  const n = {
    id:uid(), title:"Catatan baru", folderId: state.filterFolder || null,
    tags: state.filterTag ? [state.filterTag] : [],
    favorite:false, archived:false, createdAt:now(), updatedAt:now(), content:""
  };
  DB.notes.unshift(n);
  saveNow();
  openNote(n.id);
}
async function deleteNote(id){
  const ok = await showConfirm({
    title:"Hapus catatan ini?",
    message:"Tindakan ini tidak bisa dibatalkan.",
    confirmText:"Hapus", cancelText:"Batal", danger:true
  });
  if(!ok) return;
  DB.notes = DB.notes.filter(n=>n.id!==id);
  await saveNow();
  state.route="list"; state.activeNoteId=null;
  render();
  showToast("Catatan dihapus");
}

function folderOptionsHtml(selectedId){
  let out = `<option value="">— tanpa folder —</option>`;
  allFolders().forEach(({folder,path})=>{
    out += `<option value="${folder.id}" ${folder.id===selectedId?'selected':''}>${escHtml(path.join(" / "))}</option>`;
  });
  return out;
}

function renderEditor(){

  const el = document.getElementById("editorPane");
  if(!note){ state.route="list"; render(); return; }

  el.innerHTML = `

      </div>

    </div>
    <div class="editor-meta">

      <div class="meta-row">
        <div class="meta-field">📁 <select id="folderSelect">${folderOptionsHtml(note.folderId)}</select></div>

        <button class="meta-toggle ${note.favorite?'on':''}" id="toggleFav">★ Favorit</button>

  let debounceTimer = null;
  function scheduleSave(){
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(()=>{
      note.title = titleInput.value.trim() || "(tanpa judul)";
      note.folderId = folderSelect.value || null;
      note.tags = tagsInput.value.split(",").map(s=>s.trim()).filter(Boolean);

function insertMarkdown(textarea, kind){
  const start = textarea.selectionStart, end = textarea.selectionEnd;
  const val = textarea.value;
  const sel = val.slice(start,end);
  let before="", after="", placeholder="";
  switch(kind){
    case "bold": before="**"; after="**"; placeholder="teks tebal"; break;
    case "italic": before="_"; after="_"; placeholder="teks miring"; break;
    case "h2": before="\n## "; after=""; placeholder="Judul bagian"; break;
    case "code": before="\n```\n"; after="\n```\n"; placeholder="kode di sini"; break;
    case "check": before="\n- [ ] "; after=""; placeholder="tugas baru"; break;
    case "image": before="\n![alt teks]("; after=")"; placeholder="https://url-gambar.jpg"; break;
    case "attach": before="\n[nama lampiran]("; after=")"; placeholder="https://tautan-atau-file"; break;
    case "wikilink": before="[["; after="]]"; placeholder="Judul Catatan Lain"; break;
  }
  const text = sel || placeholder;
  const newVal = val.slice(0,start) + before + text + after + val.slice(end);
  textarea.value = newVal;
  const cursor = start + before.length + text.length;
  textarea.focus();
  textarea.setSelectionRange(cursor, cursor);
}

function updatePreview(md){
  const prev = document.getElementById("previewArea");
  if(!prev) return;
  let html;
  try{
    const withLinks = (md||"").replace(/\[\[([^\]]+)\]\]/g, (m,t)=>{
      const target = DB.notes.find(n=>n.title.toLowerCase()===t.trim().toLowerCase());
      return `[${t}](#wikilink:${target?target.id:''})`;
    });
    html = window.marked ? marked.parse(withLinks) : escHtml(md);
  }catch(e){ html = escHtml(md); }
  prev.innerHTML = html || `<p style="color:var(--text-dim)">Belum ada isi. Mulai menulis di panel kiri.</p>`;
  prev.querySelectorAll('a[href^="#wikilink:"]').forEach(a=>{
    a.addEventListener("click",(e)=>{
      e.preventDefault();
      const id = a.getAttribute("href").split(":")[1];
      if(id) openNote(id);
      else showAlert({
        title:"Catatan belum ada",
        message:`Belum ada catatan berjudul "${a.textContent}". Buat catatan baru dengan judul tersebut untuk menautkannya.`
      });
    });
  });
}

/* ============ RENDER: CONTEXT PANEL (backlinks + AI tidy-up) ============ */
function renderContextPanel(){
  const el = document.getElementById("ctxPanel");
  if(!el) return;
  const note = state.route==="editor" ? noteById(state.activeNoteId) : null;

  let html = "";
  if(!note){
    html += `<div class="ctx-block"><div class="ctx-title">TAUTAN</div><div class="ctx-empty">Buka sebuah catatan untuk melihat tautan masuk &amp; keluar.</div></div>`;
  } else {
    const outs = outgoingLinks(note);
    const backs = backlinksTo(note);
    html += `<div class="ctx-block">
      <div class="ctx-title">TERTAUT KE (${outs.length})</div>`;
    html += outs.length ? outs.map(o=>`<div class="link-row" data-goto="${o.id}"><span class="arrow">→</span>${escHtml(o.title)}</div>`).join("")
      : `<div class="ctx-empty">Tidak ada tautan keluar. Pakai [[Judul]] di isi catatan.</div>`;
    html += `</div><div class="ctx-block">
      <div class="ctx-title">DISEBUT DARI (${backs.length})</div>`;
    html += backs.length ? backs.map(o=>`<div class="link-row" data-goto="${o.id}"><span class="arrow">←</span>${escHtml(o.title)}</div>`).join("")
      : `<div class="ctx-empty">Belum ada catatan lain yang menyebut ini.</div>`;
    html += `</div>`;
  }

  // Panel AI untuk merapikan teks sebelum ditempel ke catatan.
  html += `<div class="ctx-block ai-tidy-block">
    <div class="ctx-title">✦ RAPIKAN TEKS (AI)</div>
    <div class="ai-tidy-desc">Tempel teks berantakan (hasil salin dari web, chat, dsb), lalu rapikan di sini sebelum kamu tempel ke catatan.</div>
    <textarea class="ai-tidy-input" id="aiTidyInput" placeholder="Tempel teks di sini…"></textarea>
    <button class="btn primary ai-tidy-btn" id="aiTidyBtn">✦ Rapikan dengan AI</button>
    <div class="ai-tidy-output-wrap" id="aiTidyOutputWrap" style="display:none">
      <div class="ai-tidy-output" id="aiTidyOutput"></div>
      <button class="tb-btn ai-tidy-copy" id="aiTidyCopyBtn">📋 Salin hasil rapi</button>
    </div>
  </div>`;

  el.innerHTML = html;
  el.querySelectorAll("[data-goto]").forEach(n=> n.addEventListener("click", ()=> openNote(n.getAttribute("data-goto"))));
  wireAiTidyPanel();
}

/* ---------- AI tidy-up: calls the completion API to clean pasted text ---------- */
async function tidyTextWithAI(rawText){
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1000,
      messages: [
        {
          role: "user",
          content:
`Rapikan teks berikut ini agar enak dibaca dan siap ditempel ke catatan pribadi. Aturan:
- Perbaiki ejaan, tanda baca, dan spasi yang berantakan.
- Susun ulang jadi paragraf atau daftar (bullet/numbering) yang wajar bila teks aslinya berupa tumpukan kalimat tanpa jeda.
- Hapus pengulangan/duplikasi yang jelas-jelas tidak perlu (misalnya cuplikan sumber yang berulang-ulang), tapi JANGAN menghapus informasi atau makna penting.
- Gunakan format Markdown ringan (heading "##", bold, bullet list) hanya jika benar-benar membantu keterbacaan.
- JANGAN menambahkan komentar, opini, salam pembuka/penutup, atau catatan apa pun dari kamu. Balas HANYA dengan hasil teks yang sudah dirapikan, tidak lebih.

Teks yang perlu dirapikan:
"""
${rawText}
"""`
        }
      ]
    })
  });
  if(!response.ok){
    throw new Error("permintaan API gagal (kode "+response.status+")");
  }
  const data = await response.json();
  const text = (data.content||[]).filter(b=>b.type==="text").map(b=>b.text||"").join("\n").trim();
  if(!text) throw new Error("respons AI kosong");
  return text;
}

function wireAiTidyPanel(){
  const btn = document.getElementById("aiTidyBtn");
  if(!btn) return;
  const input = document.getElementById("aiTidyInput");
  const outWrap = document.getElementById("aiTidyOutputWrap");
  const out = document.getElementById("aiTidyOutput");
  const copyBtn = document.getElementById("aiTidyCopyBtn");

  btn.addEventListener("click", async ()=>{
    const raw = input.value.trim();
    if(!raw){ showToast("Tempel teks dulu sebelum dirapikan"); input.focus(); return; }
    const originalLabel = btn.textContent;
    btn.disabled = true;
    btn.textContent = "Merapikan…";
    try{
      const cleaned = await tidyTextWithAI(raw);
      out.textContent = cleaned;
      outWrap.style.display = "block";
    }catch(e){
      showToast("Gagal merapikan teks: "+e.message, {danger:true});
    }finally{
      btn.disabled = false;
      btn.textContent = originalLabel;
    }
  });

  if(copyBtn) copyBtn.addEventListener("click", async ()=>{
    try{
      await navigator.clipboard.writeText(out.textContent);
      showToast("Teks rapi disalin ke clipboard");
    }catch(e){
      showToast("Gagal menyalin otomatis, salin manual dari kotak di atas", {danger:true});
    }
  });
}

/* ============ RENDER: GRAPH ============ */
function renderGraph(){
  const wrap = document.getElementById("graphWrap");
  const notes = DB.notes.filter(n=>!n.archived);
  const idIndex = {}; notes.forEach((n,i)=> idIndex[n.id]=i);
  const edges = [];
  notes.forEach(n=>{
    outgoingLinks(n).forEach(t=>{
      if(idIndex[t.id]!==undefined) edges.push([idIndex[n.id], idIndex[t.id]]);
    });
  });

  if(notes.length===0){
    wrap.innerHTML = `<div class="empty-state" style="padding-top:80px"><div class="glyph">◌</div><div>Belum ada catatan untuk dipetakan.</div></div>`;
    return;
  }

  const W = wrap.clientWidth || 900, H = wrap.clientHeight || 600;
  const nodes = notes.map((n,i)=>({
    id:n.id, title:n.title, favorite:n.favorite,
    x: W/2 + Math.cos(i*2.4)* (80+ i*7),
    y: H/2 + Math.sin(i*2.4)* (80+ i*7),
    vx:0, vy:0
  }));

  for(let iter=0; iter<220; iter++){
    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        let dx = nodes[j].x-nodes[i].x, dy = nodes[j].y-nodes[i].y;
        let dist = Math.sqrt(dx*dx+dy*dy)||1;
        const rep = 1800/(dist*dist);
        const fx = (dx/dist)*rep, fy=(dy/dist)*rep;
        nodes[i].vx -= fx; nodes[i].vy -= fy;
        nodes[j].vx += fx; nodes[j].vy += fy;
      }
    }
    edges.forEach(([a,b])=>{
      let dx = nodes[b].x-nodes[a].x, dy = nodes[b].y-nodes[a].y;
      let dist = Math.sqrt(dx*dx+dy*dy)||1;
      const target = 130;
      const f = (dist-target)*0.02;
      const fx = (dx/dist)*f, fy=(dy/dist)*f;
      nodes[a].vx += fx; nodes[a].vy += fy;
      nodes[b].vx -= fx; nodes[b].vy -= fy;
    });
    nodes.forEach(n=>{
      n.vx += (W/2 - n.x)*0.0015;
      n.vy += (H/2 - n.y)*0.0015;
      n.x += n.vx*0.6; n.y += n.vy*0.6;
      n.vx*=0.82; n.vy*=0.82;
      n.x = Math.max(40, Math.min(W-40, n.x));
      n.y = Math.max(40, Math.min(H-40, n.y));
    });
  }

  let svg = `<svg viewBox="0 0 ${W} ${H}">`;
  edges.forEach(([a,b])=>{
    svg += `<line class="g-edge" x1="${nodes[a].x}" y1="${nodes[a].y}" x2="${nodes[b].x}" y2="${nodes[b].y}"/>`;
  });
  nodes.forEach((n,i)=>{
    svg += `<g class="g-node ${n.favorite?'fav':''}" data-node="${i}" transform="translate(${n.x},${n.y})">
      <circle r="7"></circle>
      <text x="12" y="4">${escHtml(n.title.length>26?n.title.slice(0,26)+'…':n.title)}</text>
    </g>`;
  });
  svg += `</svg>`;
  wrap.innerHTML = svg + `<div class="graph-hint">${notes.length} catatan · ${edges.length} tautan — seret titik, klik/ketuk untuk membuka</div>`;

  const svgEl = wrap.querySelector("svg");
  let dragging = null;
  let dragMoved = false;

  function pointFromEvent(e){
    const rect = svgEl.getBoundingClientRect();
    const scaleX = W/rect.width, scaleY = H/rect.height;
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x:(clientX-rect.left)*scaleX, y:(clientY-rect.top)*scaleY };
  }
  function startDrag(i, e){ dragging = i; dragMoved = false; if(e.cancelable) e.preventDefault(); }
  function moveDrag(e){
    if(dragging===null) return;
    dragMoved = true;
    const p = pointFromEvent(e);
    nodes[dragging].x = p.x; nodes[dragging].y = p.y;
    if(e.cancelable) e.preventDefault();
    redrawGraphPositions();
  }
  function endDrag(){ const wasDragging = dragging!==null; dragging=null; return wasDragging; }

  svgEl.querySelectorAll("[data-node]").forEach(g=>{
    const i = +g.getAttribute("data-node");
    g.addEventListener("mousedown",(e)=> startDrag(i,e));
    g.addEventListener("touchstart",(e)=> startDrag(i,e), {passive:false});
    g.addEventListener("click",()=>{ if(!dragMoved) openNote(nodes[i].id); });
  });
  svgEl.addEventListener("mousemove", moveDrag);
  svgEl.addEventListener("touchmove", moveDrag, {passive:false});
  window.addEventListener("mouseup",()=>{ endDrag(); setTimeout(()=>dragMoved=false,0); });
  window.addEventListener("touchend",()=>{
    const wasDragging = endDrag();
    if(wasDragging) setTimeout(()=>dragMoved=false,0);
  });

  function redrawGraphPositions(){
    edges.forEach(([a,b],idx)=>{
      const line = svgEl.querySelectorAll(".g-edge")[idx];
      line.setAttribute("x1",nodes[a].x); line.setAttribute("y1",nodes[a].y);
      line.setAttribute("x2",nodes[b].x); line.setAttribute("y2",nodes[b].y);
    });
    nodes.forEach((n,i)=>{
      svgEl.querySelector(`[data-node="${i}"]`).setAttribute("transform",`translate(${n.x},${n.y})`);
    });
  }
}

/* ============ EXPORT / IMPORT ============ */
function exportJson(){
  const blob = new Blob([JSON.stringify(DB, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "simpul-knowledge-base-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast("Berkas JSON diunduh");
}
function importJson(file){
  const reader = new FileReader();
  reader.onload = async ()=>{
    let parsed;
    try{
      parsed = JSON.parse(reader.result);
      if(!parsed.notes || !parsed.folders) throw new Error("format tidak sesuai");
    }catch(e){
      await showAlert({title:"Gagal mengimpor", message:"Pastikan file berasal dari ekspor Simpul yang valid (.json)."});
      return;
    }
    const ok = await showConfirm({
      title:"Impor data?",
      message:"Ini akan menggantikan semua data yang tersimpan sekarang. Pertimbangkan untuk mengekspor data saat ini dulu sebagai cadangan.",
      confirmText:"Impor & ganti", cancelText:"Batal", danger:true
    });
    if(!ok) return;
    DB = parsed;
    state.expandedFolders = new Set();
    await persist(DB);
    state.route="list"; state.activeNoteId=null; state.filterFolder=null; state.filterTag=null; state.filterSpecial=null;
    render();
    showToast("Data berhasil diimpor");
  };
  reader.readAsText(file);
}

document.getElementById("searchInput").addEventListener("input", (e)=>{
  state.search = e.target.value;
  if(state.route!=="list"){ state.route="list"; state.activeNoteId=null; }
  render();
});

document.getElementById("btnGraph").addEventListener("click", ()=>{
  state.route = state.route==="graph" ? "list" : "graph";
  render();
});
document.getElementById("btnExport").addEventListener("click", exportJson);
document.getElementById("btnImport").addEventListener("click", ()=> document.getElementById("fileImport").click());
document.getElementById("fileImport").addEventListener("change", (e)=>{
  if(e.target.files[0]) importJson(e.target.files[0]);
  e.target.value = "";
});

document.querySelectorAll("#bottomNav [data-bn]").forEach(btn=> btn.addEventListener("click", ()=>{
  const action = btn.getAttribute("data-bn");
  if(action==="all"){
    state.filterFolder=null; state.filterTag=null; state.filterSpecial=null;
    state.route="list"; state.activeNoteId=null; closeDrawer(); render();
  } else if(action==="folders"){
    openDrawer();
  } else if(action==="new"){
    closeDrawer(); createNote();
  } else if(action==="graph"){
    closeDrawer(); state.route="graph"; render();
  } else if(action==="more"){
    openActionSheet("Lainnya", [
      {label:"Ekspor JSON", icon:"⬇", onClick: exportJson},
      {label:"Impor JSON", icon:"⬆", onClick: ()=> document.getElementById("fileImport").click()},
    ]);
  }
}));

})();
